<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rölöve Kroki</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f2a37">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f5f7;--ink:#1f2a37;--mut:#6b7280;--acc:#0b7cc1;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--ink);color:#fff}
header .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:#e8ebf0;color:var(--ink);cursor:pointer}
button:active{filter:brightness(.92)}
button.p{background:var(--acc);color:#fff}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.45}
header button{background:#334155;color:#fff;padding:7px 10px}
#ble.ok{background:var(--ok)}#ble.busy{background:#a16207}#ble.bad{background:var(--bad)}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#fbfbfc}
#hint{position:absolute;left:8px;right:56px;top:8px;background:rgba(31,42,55,.9);color:#fff;border-radius:10px;padding:7px 10px;font-size:13.5px;pointer-events:none}
#hint:empty{display:none}
#hint .g{color:#86efac}#hint .w{color:#fdba74}#hint .b{color:#fca5a5}
#fab{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#fab button{width:42px;height:42px;padding:0;border-radius:21px;background:rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:18px}
#fab #bCheck{font-size:13px;font-weight:700}
#toast{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;text-align:center}
#toast.show{opacity:.95}
#flash{position:absolute;right:10px;bottom:12px;background:var(--ok);color:#fff;font-weight:700;font-size:20px;padding:6px 12px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
#flash.show{opacity:1}
#panel{background:var(--card);border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>button{flex:1;min-width:0;padding:10px 6px}
.info{font-size:13.5px;color:var(--mut)}
.info b{color:var(--ink)}
input[type=text],select{font:inherit;padding:9px 10px;border:1px solid #cbd5e1;border-radius:10px;min-width:0;background:#fff;color:var(--ink)}
.num{flex:1}
nav{display:flex;gap:5px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:9px 2px;font-size:13.5px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:10}
.sheet.hidden{display:none}
.sheet .box{background:var(--card);width:100%;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));touch-action:pan-y;user-select:text;-webkit-user-select:text}
.box h3{margin:6px 0 8px;font-size:16px}
.box .row>button{flex:1 1 45%}
.box label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.list button{display:block;width:100%;text-align:left;margin:4px 0}
pre{font-size:12px;background:#f1f5f9;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:12px;background:#e2e8f0;color:var(--ink)}
.tag.ok{background:#dcfce7;color:var(--ok)}.tag.warn{background:#ffedd5;color:var(--warn)}.tag.bad{background:#fee2e2;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:4px 0 10px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="bMenu" aria-label="Menü">☰</button>
    <div class="t" id="title">Rölöve Kroki</div>
    <button id="ble">Lazer bağla</button>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="fab">
      <button id="bUndo" aria-label="Geri al">↶</button>
      <button id="bRedo" aria-label="Yinele">↷</button>
      <button id="bFit" aria-label="Sığdır">⤢</button>
      <button id="bCheck" aria-label="Kontrol">✓?</button>
    </div>
    <div id="toast"></div>
    <div id="flash"></div>
  </div>
  <div id="panel"></div>
  <nav>
    <button data-tool="takip">Takip</button>
    <button data-tool="ciz">El çizimi</button>
    <button data-tool="cizgi">Çizgi</button>
    <button data-tool="mesafe">Çapraz</button>
    <button data-tool="sec">Seç</button>
  </nav>
</div>
<div class="sheet hidden" id="sheet"><div class="box" id="sheetBox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
/* =================== Sabitler =================== */
const SVC = '02a6c0d0-0451-4000-b000-fb3210111989';
const CHR = '02a6c0d1-0451-4000-b000-fb3210111989';
const AUTOSYNC = [0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A];
const LS_PROJ = 'rk2_projects', LS_CUR = 'rk2_current', LS_SET = 'rk2_settings';
const deg = Math.PI / 180;
const SIG_EST = 0.5;     // ölçülmemiş kenar tahmini (m)
const SIG_ON = 0.001;    // çizgi üstünde nokta (m)

/* =================== Durum =================== */
const defSet = { scaleDen: 50, defaultTurn: -90, autoAdvance: true, offset: 0, demo: false, closeTol: 0.02, sigD: 0.002, sigA: 2, gonyeTol: 0.3, autoDiag: true };
let SET = Object.assign({}, defSet, readJSON(LS_SET, {}));
let P = null;
let S = { tool: 'takip', active: null, sel: null, pendingTurn: SET.defaultTurn, lastMeasure: null, chain: null };
let A = null;   // son analiz
let undoStack = [], redoStack = [];
let view = { s: 40, ox: 0, oy: 0 };
const bleLog = [];

function readJSON(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function newProject(name) { return { v: 2, name: name || ('Proje ' + new Date().toLocaleDateString('tr-TR')), pts: [], edges: [], shapes: [], cons: [], naming: { prefix: '', num: 1 }, roomSeq: 0, created: Date.now() }; }
function allProjects() { return readJSON(LS_PROJ, {}); }
function saveProject() { const all = allProjects(); P.saved = Date.now(); all[P.name] = P; writeJSON(LS_PROJ, all); localStorage.setItem(LS_CUR, P.name); }

/* ---------- v1 → v2 dönüştürme ---------- */
function migrateV1() {
  const old = readJSON('rk_projects', null); if (!old) return;
  const all = allProjects(); let changed = false;
  Object.values(old).forEach(op => {
    if (all[op.name]) return;
    const np = newProject(op.name); np.naming.prefix = '';
    (op.rooms || []).forEach(r => {
      let x = r.x0, y = r.y0, h = r.h0; const pts = [[x, y]];
      r.legs.forEach((L, i) => { if (i) h += L.turn; x += L.len * Math.cos(h * deg); y += L.len * Math.sin(h * deg); pts.push([x, y]); });
      const sh = { id: uid('s'), kind: 'room', name: r.name, ring: [], closed: !!r.closed, turn: [] };
      let n = pts.length; let closeMerge = r.closed && Math.hypot(pts[n - 1][0] - pts[0][0], pts[n - 1][1] - pts[0][1]) < 0.05;
      const m = closeMerge ? n - 1 : n;
      for (let k = 0; k < m; k++) { const id = uid('p'); np.pts.push({ id, name: r.prefix + (k + 1), x: pts[k][0], y: pts[k][1] }); sh.ring.push(id); }
      r.legs.forEach((L, i) => { const a = sh.ring[i], b = sh.ring[(i + 1) % m]; if (!b) return; np.edges.push({ id: uid('e'), a, b, kind: 'wall', len: L.measured ? L.len : null, est: L.len }); });
      sh.turn = sh.ring.map((_, k) => (k > 0 && k < r.legs.length) ? r.legs[k].turn : null);
      np.shapes.push(sh); np.roomSeq++;
    });
    all[np.name] = np; changed = true;
  });
  if (changed) writeJSON(LS_PROJ, all);
}
function loadInitial() { migrateV1(); const all = allProjects(); const cur = localStorage.getItem(LS_CUR); P = (cur && all[cur]) ? all[cur] : newProject(); }

/* =================== Yardımcılar =================== */
const $ = q => document.querySelector(q);
const norm180 = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; };
const wrapPI = a => Math.atan2(Math.sin(a), Math.cos(a));
const fmt = v => v.toFixed(3);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function parseNum(s) { s = String(s).trim().replace(',', '.'); const v = parseFloat(s); return isFinite(v) ? v : NaN; }
function turnText(t) { if (t === null || t === undefined) return 'serbest'; t = norm180(t); if (Math.abs(t) < 1e-9) return 'Düz'; return (t > 0 ? 'Sol ' : 'Sağ ') + (+Math.abs(t).toFixed(2)) + '°'; }
const ptById = id => P.pts.find(p => p.id === id);
const edgeById = id => P.edges.find(e => e.id === id);
const shapeById = id => P.shapes.find(s => s.id === id);
const pname = id => { const p = ptById(id); return p ? p.name : '?'; };
const plen = (a, b) => { const p = ptById(a), q = ptById(b); return Math.hypot(q.x - p.x, q.y - p.y); };
const edgeName = e => pname(e.a) + '–' + pname(e.b);
function nextName() {
  const used = new Set(P.pts.map(p => p.name)); let n;
  do { n = (P.naming.prefix || '') + P.naming.num; P.naming.num++; } while (used.has(n));
  return n;
}
function addPt(x, y, name) { const id = uid('p'); P.pts.push({ id, name: name || nextName(), x, y }); return id; }
function addEdge(a, b, kind, len) { const e = { id: uid('e'), a, b, kind, len: len === undefined ? null : len, est: plen(a, b) }; P.edges.push(e); return e; }
function findEdge(a, b) { return P.edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a)); }
function shapeEdges(sh) { const out = []; const n = sh.ring.length; const m = sh.closed ? n : n - 1; for (let i = 0; i < m; i++) { const e = findEdge(sh.ring[i], sh.ring[(i + 1) % n]); if (e) out.push(e); } return out; }
function shapeOfPoint(id) { return P.shapes.find(s => s.ring.includes(id)); }
function polyArea(ids) { let s = 0; for (let i = 0; i < ids.length; i++) { const a = ptById(ids[i]), b = ptById(ids[(i + 1) % ids.length]); s += a.x * b.y - b.x * a.y; } return s / 2; }
function headOf(a, b) { const p = ptById(a), q = ptById(b); return Math.atan2(q.y - p.y, q.x - p.x) / deg; }

/* =================== Geri al / yinele =================== */
function snap() { undoStack.push(JSON.stringify(P)); if (undoStack.length > 150) undoStack.shift(); redoStack = []; }
function undo() { if (!undoStack.length) return toast('Geri alınacak işlem yok'); redoStack.push(JSON.stringify(P)); P = JSON.parse(undoStack.pop()); fixSel(); commit(); }
function redo() { if (!redoStack.length) return toast('Yinelenecek işlem yok'); undoStack.push(JSON.stringify(P)); P = JSON.parse(redoStack.pop()); fixSel(); commit(); }
function fixSel() {
  if (S.sel && S.sel.type === 'edge' && !edgeById(S.sel.id)) S.sel = null;
  if (S.sel && S.sel.type === 'pt' && !ptById(S.sel.id)) S.sel = null;
  if (S.active && !shapeById(S.active)) S.active = null;
  if (S.chain && !shapeById(S.chain)) S.chain = null;
}
function commit() { solve(); A = analyze(); saveProject(); render(); }

/* =================== Dengeleme (en küçük kareler) =================== */
const F = {
  dist: c => Math.hypot(c[2] - c[0], c[3] - c[1]) + 1e-12,
  turn: c => Math.atan2(c[5] - c[3], c[4] - c[2]) - Math.atan2(c[3] - c[1], c[2] - c[0]),
  online: c => { const dx = c[4] - c[2], dy = c[5] - c[3], l = Math.hypot(dx, dy) + 1e-12; return (dx * (c[1] - c[3]) - dy * (c[0] - c[2])) / l; },
  perp: c => { const ux = c[2] - c[0], uy = c[3] - c[1], vx = c[6] - c[4], vy = c[7] - c[5]; return (ux * vx + uy * vy) / ((Math.hypot(ux, uy) + 1e-12) * (Math.hypot(vx, vy) + 1e-12)); }
};
function buildObs(weak) {
  const O = [];
  P.edges.forEach(e => {
    if (e.len != null) O.push({ ids: [e.a, e.b], f: F.dist, v: e.len, s: SET.sigD, k: 'd', e });
    else if (weak) O.push({ ids: [e.a, e.b], f: F.dist, v: e.est, s: SIG_EST, k: 'est', e });
  });
  if (weak) P.shapes.forEach(sh => {
    const n = sh.ring.length; if (n < 3) return;
    sh.turn.forEach((t, i) => {
      if (t === null || t === undefined) return;
      if (!sh.closed && (i === 0 || i === n - 1)) return;
      const a = sh.ring[(i - 1 + n) % n], b = sh.ring[i], c = sh.ring[(i + 1) % n];
      if (!findEdge(a, b) || !findEdge(b, c)) return;
      O.push({ ids: [a, b, c], f: F.turn, v: t * deg, s: SET.sigA * deg, k: 'turn', wrap: true, sh, i });
    });
  });
  P.cons.forEach(c => {
    if (c.type === 'online') O.push({ ids: [c.p, c.a, c.b], f: F.online, v: 0, s: SIG_ON, k: 'on' });
    else if (c.type === 'perp' && weak) O.push({ ids: [c.a, c.b, c.c, c.d], f: F.perp, v: 0, s: SET.sigA * deg, k: 'perp' });
  });
  return O.filter(o => o.ids.every(id => ptById(id)));
}
function obsGrad(o, X, idx) {
  const cols = []; o.ids.forEach(id => { const j = idx.get(id); cols.push(2 * j, 2 * j + 1); });
  const c = cols.map(k => X[k]); const f0 = o.f(c);
  let r = f0 - o.v; if (o.wrap) r = wrapPI(r);
  const g = cols.map((_, m) => { const h = 1e-6; const c1 = c.slice(); c1[m] += h; const c2 = c.slice(); c2[m] -= h; let d = o.f(c1) - o.f(c2); if (o.wrap) d = wrapPI(d); return d / (2 * h); });
  return { cols, g, r };
}
function cholSolve(N, b, n) {
  const L = new Float64Array(n * n);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let s = N[i * n + j]; for (let k = 0; k < j; k++) s -= L[i * n + k] * L[j * n + k];
      if (i === j) L[i * n + i] = Math.sqrt(Math.max(s, 1e-18)); else L[i * n + j] = s / L[j * n + j];
    }
  }
  const y = new Float64Array(n); for (let i = 0; i < n; i++) { let s = b[i]; for (let k = 0; k < i; k++) s -= L[i * n + k] * y[k]; y[i] = s / L[i * n + i]; }
  const x = new Float64Array(n); for (let i = n - 1; i >= 0; i--) { let s = y[i]; for (let k = i + 1; k < n; k++) s -= L[k * n + i] * x[k]; x[i] = s / L[i * n + i]; }
  return x;
}
function solve() {
  if (!P.pts.length) return;
  const idx = new Map(P.pts.map((p, i) => [p.id, i])); const n = P.pts.length * 2;
  const X = new Float64Array(n); P.pts.forEach((p, i) => { X[2 * i] = p.x; X[2 * i + 1] = p.y; }); const X0 = X.slice();
  const O = buildObs(true);
  for (let it = 0; it < 25; it++) {
    const N = new Float64Array(n * n), b = new Float64Array(n);
    for (let k = 0; k < n; k++) { const w = 1e-6; N[k * n + k] += w + 1e-9; b[k] += w * (X[k] - X0[k]); }
    O.forEach(o => {
      const { cols, g, r } = obsGrad(o, X, idx); const w = 1 / (o.s * o.s);
      for (let a = 0; a < cols.length; a++) { b[cols[a]] += w * g[a] * r; for (let c = 0; c < cols.length; c++) N[cols[a] * n + cols[c]] += w * g[a] * g[c]; }
    });
    const dx = cholSolve(N, b, n); let mx = 0;
    for (let k = 0; k < n; k++) { const d = Math.max(-5, Math.min(5, dx[k])); X[k] -= d; mx = Math.max(mx, Math.abs(d)); }
    if (mx < 1e-8) break;
  }
  P.pts.forEach((p, i) => { p.x = X[2 * i]; p.y = X[2 * i + 1]; });
}

/* ---------- Belirlilik ve gönye analizi ---------- */
function analyze() {
  const res = { unfixed: new Set(), defect: 0, redund: 0, conflicts: [], shapes: [], sug: [] };
  if (!P.pts.length) return res;
  const idxAll = new Map(P.pts.map((p, i) => [p.id, i]));
  const XA = new Float64Array(P.pts.length * 2); P.pts.forEach((p, i) => { XA[2 * i] = p.x; XA[2 * i + 1] = p.y; });
  const O = buildObs(false);
  O.forEach(o => { if (o.k === 'd') { const { r } = obsGrad(o, XA, idxAll); const lim = Math.max(3 * SET.sigD, 0.005); if (Math.abs(r) > lim) res.conflicts.push({ e: o.e, r }); } });
  // ölçüyle bağlı bileşenler
  const par = new Map(P.pts.map(p => [p.id, p.id])); const find = x => { while (par.get(x) !== x) { par.set(x, par.get(par.get(x))); x = par.get(x); } return x; };
  O.forEach(o => o.ids.slice(1).forEach(id => { const ra = find(o.ids[0]), rb = find(id); if (ra !== rb) par.set(ra, rb); }));
  const comps = new Map(); P.pts.forEach(p => { const r = find(p.id); if (!comps.has(r)) comps.set(r, []); comps.get(r).push(p); });
  comps.forEach(cp => {
    if (cp.length < 2) { cp.forEach(p => res.unfixed.add(p.id)); return; }
    const idx = new Map(cp.map((p, i) => [p.id, i])); const n = cp.length * 2;
    const X = new Float64Array(n); cp.forEach((p, i) => { X[2 * i] = p.x; X[2 * i + 1] = p.y; });
    const rows = [];
    O.forEach(o => { if (!idx.has(o.ids[0])) return; const { cols, g } = obsGrad(o, X, idx); const row = new Float64Array(n); cols.forEach((c, m) => row[c] += g[m]); rows.push(row); });
    let cx = 0, cy = 0; cp.forEach(p => { cx += p.x; cy += p.y; }); cx /= cp.length; cy /= cp.length;
    const gx = new Float64Array(n), gy = new Float64Array(n), gr = new Float64Array(n);
    cp.forEach((p, i) => { gx[2 * i] = 1; gy[2 * i + 1] = 1; gr[2 * i] = -(p.y - cy); gr[2 * i + 1] = p.x - cx; });
    const M = rows.concat([gx, gy, gr]).map(r => { let s = 0; for (const v of r) s += v * v; s = Math.sqrt(s) || 1; return r.map(v => v / s); });
    const piv = []; let rI = 0;
    for (let c = 0; c < n && rI < M.length; c++) {
      let best = rI; for (let r = rI + 1; r < M.length; r++) if (Math.abs(M[r][c]) > Math.abs(M[best][c])) best = r;
      if (Math.abs(M[best][c]) < 1e-8) continue;
      [M[rI], M[best]] = [M[best], M[rI]]; const pv = M[rI][c]; for (let k = 0; k < n; k++) M[rI][k] /= pv;
      for (let r = 0; r < M.length; r++) if (r !== rI && Math.abs(M[r][c]) > 1e-14) { const f = M[r][c]; for (let k = 0; k < n; k++) M[r][k] -= f * M[rI][k]; }
      piv.push(c); rI++;
    }
    const pivSet = new Set(piv); res.defect += n - piv.length; res.redund += Math.max(0, rows.length - (piv.length - 3));
    for (let f = 0; f < n; f++) {
      if (pivSet.has(f)) continue;
      const v = new Float64Array(n); v[f] = 1; piv.forEach((pc, r) => v[pc] = -M[r][f]);
      let mx = 0; const mag = cp.map((p, i) => { const m = Math.hypot(v[2 * i], v[2 * i + 1]); mx = Math.max(mx, m); return m; });
      mag.forEach((m, i) => { if (m > 0.15 * mx && m > 1e-9) res.unfixed.add(cp[i].id); });
    }
  });
  // şekil bazında
  P.shapes.forEach(sh => {
    const n0 = sh.ring.length; if (n0 < 2) return;
    const area = sh.closed && n0 >= 3 ? polyArea(sh.ring) : 0; const orient = area >= 0 ? 1 : -1;

  else if (m === 'new') { const n = prompt('Yeni proje adı', 'Proje ' + new Date().toLocaleDateString('tr-TR')); if (!n) return; if (allProjects()[n] && !confirm('Bu adda proje var, üzerine yazılsın mı?')) return; saveProject(); P = newProject(n); undoStack = []; redoStack = []; S.active = null; S.sel = null; S.chain = null; commit(); fit(); closeSheet(); }
  else if (m === 'open') { const all = allProjects(); const names = Object.keys(all).sort((a, b) => (all[b].saved || 0) - (all[a].saved || 0)); openSheet('<h3>Projeler</h3><div class="list">' + names.map(n => `<button data-open="${esc(n)}">${esc(n)} <span class="tag">${(all[n].shapes || []).length} şekil</span></button>`).join('') + '</div><div class="row"><button data-m="close">Kapat</button></div>'); }
  else if (b.dataset.open) { saveProject(); P = allProjects()[b.dataset.open]; undoStack = []; redoStack = []; S.active = null; S.sel = null; S.chain = null; commit(); fit(); closeSheet(); }
  else if (m === 'rename') { const n = prompt('Proje adı', P.name); if (!n || n === P.name) return; const all = allProjects(); delete all[P.name]; writeJSON(LS_PROJ, all); P.name = n; commit(); closeSheet(); }
  else if (m === 'import') $('#fileIn').click();
  else if (m === 'shName') { if (!sh) return; const n = prompt('Ad', sh.name); if (n) { snap(); sh.name = n; commit(); } closeSheet(); }
  else if (m === 'shDel') { if (sh && confirm(sh.name + ' silinsin mi?')) { snap(); deleteShape(sh); commit(); } closeSheet(); }
  else if (m === 'saveSet') {
    SET.scaleDen = +$('#sScale').value; SET.defaultTurn = +$('#sTurn').value; SET.autoAdvance = $('#sAuto').checked; SET.autoDiag = $('#sDiag').checked; SET.demo = $('#sDemo').checked;
    const off = parseNum($('#sOff').value); SET.offset = isFinite(off) ? off : 0; const g = parseNum($('#sGon').value); SET.gonyeTol = g > 0 ? g : 0.3;
    P.naming.prefix = $('#nPre').value.trim(); const nn = parseInt($('#nNum').value, 10); if (nn > 0) P.naming.num = nn;
    S.pendingTurn = SET.defaultTurn; writeJSON(LS_SET, SET); closeSheet(); commit(); toast('Kaydedildi');
  }
});
function deleteShape(sh) {
  const used = new Set(); P.shapes.forEach(s => { if (s !== sh) s.ring.forEach(id => used.add(id)); }); P.edges.forEach(e => { if (!sh.ring.includes(e.a) || !sh.ring.includes(e.b)) { used.add(e.a); used.add(e.b); } });
  const del = new Set(sh.ring.filter(id => !used.has(id)));
  P.edges = P.edges.filter(e => !(sh.ring.includes(e.a) && sh.ring.includes(e.b)) && !del.has(e.a) && !del.has(e.b));
  P.cons = P.cons.filter(c => ![c.p, c.a, c.b, c.c, c.d].some(x => del.has(x)));
  P.pts = P.pts.filter(p => !del.has(p.id)); P.shapes = P.shapes.filter(s => s !== sh); S.sel = null; if (S.active === sh.id) S.active = null;
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d || !Array.isArray(d.pts)) throw new Error('Geçersiz dosya (v2 JSON bekleniyor)'); saveProject(); P = d; if (allProjects()[P.name] && !confirm('"' + P.name + '" var, üzerine yazılsın mı?')) P.name += ' (yüklendi)'; undoStack = []; redoStack = []; S.active = null; S.sel = null; commit(); fit(); closeSheet(); toast('Proje yüklendi'); }
  catch (err) { alert('Dosya okunamadı: ' + err.message); } e.target.value = '';
});
const safeName = s => s.replace(/[\\/:*?"<>|]+/g, '_');
async function saveFile(name, data, mime) {
  const blob = new Blob([data], { type: mime });
  try { const file = new File([blob], name, { type: mime }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
}

/* =================== DXF (R12, ANSI_1254) =================== */
const CP1254 = { 'Ç': 0xC7, 'ç': 0xE7, 'Ğ': 0xD0, 'ğ': 0xF0, 'İ': 0xDD, 'ı': 0xFD, 'Ö': 0xD6, 'ö': 0xF6, 'Ş': 0xDE, 'ş': 0xFE, 'Ü': 0xDC, 'ü': 0xFC, '°': 0xB0, '²': 0xB2, '±': 0xB1, 'Â': 0xC2, 'â': 0xE2, 'Î': 0xCE, 'î': 0xEE, 'Û': 0xDB, 'û': 0xFB, '–': 0x96 };
function toCp1254(str) { const out = new Uint8Array(str.length); for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); out[i] = c < 128 ? c : (CP1254[str[i]] || 0x3F); } return out; }
function buildDXF(p, set) {
  const th = set.scaleDen * 0.0025; const L = [];
  const g = (code, val) => { L.push(String(code).padStart(3, ' ')); L.push(String(val)); };
  const n4 = v => (Math.abs(v) < 5e-5 ? 0 : v).toFixed(4);
  const layers = [['DUVAR', 7], ['DETAY', 4], ['CAPRAZ', 3], ['VARSAYIM', 1], ['OLCU', 7], ['NOKTA', 6], ['NOKTA_ADI', 6], ['YAZI', 2], ['ACI', 1]];
  g(0, 'SECTION'); g(2, 'HEADER'); g(9, '$ACADVER'); g(1, 'AC1009'); g(9, '$DWGCODEPAGE'); g(3, 'ANSI_1254');
  g(9, '$INSBASE'); g(10, '0.0'); g(20, '0.0'); g(30, '0.0'); const bb = bbox() || [0, 0, 10, 10];
  g(9, '$EXTMIN'); g(10, n4(bb[0])); g(20, n4(bb[1])); g(30, '0.0'); g(9, '$EXTMAX'); g(10, n4(bb[2])); g(20, n4(bb[3])); g(30, '0.0');
  g(9, '$TEXTSIZE'); g(40, n4(th)); g(9, '$PDMODE'); g(70, 34); g(9, '$PDSIZE'); g(40, n4(th * 0.6)); g(0, 'ENDSEC');
  g(0, 'SECTION'); g(2, 'TABLES');
  g(0, 'TABLE'); g(2, 'LTYPE'); g(70, 2);
  g(0, 'LTYPE'); g(2, 'CONTINUOUS'); g(70, 0); g(3, 'Solid line'); g(72, 65); g(73, 0); g(40, '0.0');
  g(0, 'LTYPE'); g(2, 'DASHED'); g(70, 0); g(3, '__ __ __'); g(72, 65); g(73, 2); g(40, n4(th * 4)); g(49, n4(th * 2.5)); g(49, n4(-th * 1.5)); g(0, 'ENDTAB');
  g(0, 'TABLE'); g(2, 'LAYER'); g(70, layers.length + 1); g(0, 'LAYER'); g(2, '0'); g(70, 0); g(62, 7); g(6, 'CONTINUOUS');
  layers.forEach(([n, c]) => { g(0, 'LAYER'); g(2, n); g(70, 0); g(62, c); g(6, n === 'VARSAYIM' ? 'DASHED' : 'CONTINUOUS'); }); g(0, 'ENDTAB');
  g(0, 'TABLE'); g(2, 'STYLE'); g(70, 1); g(0, 'STYLE'); g(2, 'STANDARD'); g(70, 0); g(40, '0.0'); g(41, '1.0'); g(50, '0.0'); g(71, 0); g(42, n4(th)); g(3, 'txt'); g(4, ''); g(0, 'ENDTAB'); g(0, 'ENDSEC');
  g(0, 'SECTION'); g(2, 'ENTITIES');
  const line = (lay, a, b) => { g(0, 'LINE'); g(8, lay); g(10, n4(a.x)); g(20, n4(a.y)); g(30, '0.0'); g(11, n4(b.x)); g(21, n4(b.y)); g(31, '0.0'); };
  const text = (lay, s, x, y, h, rot, center) => { g(0, 'TEXT'); g(8, lay); g(10, n4(x)); g(20, n4(y)); g(30, '0.0'); g(40, n4(h)); g(1, s); if (rot) g(50, rot.toFixed(3)); if (center) { g(72, 1); g(11, n4(x)); g(21, n4(y)); g(31, '0.0'); g(73, 2); } };
  p.edges.forEach(e => {
    const a = ptById(e.a), b = ptById(e.b); const m = e.len != null;
    const lay = !m ? 'VARSAYIM' : (e.kind === 'wall' ? 'DUVAR' : e.kind === 'detail' ? 'DETAY' : 'CAPRAZ'); line(lay, a, b);
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1; const sd = e.kind === 'diag' ? 0.6 : edgeSide(e) * 1.2;
    const nx = dy / l * sd * th, ny = -dx / l * sd * th; let rot = Math.atan2(dy, dx) / deg; if (rot > 90 || rot <= -90) rot += 180; rot = (rot + 360) % 360;
    const f = e.kind === 'diag' ? 0.35 : 0.5;
    text(m ? (e.kind === 'diag' ? 'CAPRAZ' : 'OLCU') : 'VARSAYIM', (m ? '' : '~') + (m ? e.len : l).toFixed(3), a.x + dx * f + nx, a.y + dy * f + ny, th, rot, true);
  });
  p.pts.forEach(pt => { g(0, 'POINT'); g(8, 'NOKTA'); g(10, n4(pt.x)); g(20, n4(pt.y)); g(30, '0.0'); text('NOKTA_ADI', pt.name, pt.x + th * 0.5, pt.y + th * 0.5, th * 0.8, 0, false); });
  p.shapes.forEach(sh => {
    if (sh.kind !== 'room' || sh.ring.length < 3) return; let cx = 0, cy = 0; sh.ring.forEach(id => { const q = ptById(id); cx += q.x; cy += q.y; }); cx /= sh.ring.length; cy /= sh.ring.length;
    text('YAZI', sh.name, cx, cy + th * 0.8, th * 1.4, 0, true); if (sh.closed) text('YAZI', 'A=' + Math.abs(polyArea(sh.ring)).toFixed(2) + ' m²', cx, cy - th * 1.2, th, 0, true);
    const info = A && A.shapes.find(x => x.sh.id === sh.id);
    if (info) info.corners.forEach(c => { if (c.st === 'gonyesiz' || c.st === 'olcu') { const q = ptById(c.id); text('ACI', c.inner.toFixed(2) + '°', q.x - th * 0.5, q.y - th * 1.5, th * 0.8, 0, false); } else if (c.st === 'varsayim') { const q = ptById(c.id); text('VARSAYIM', '90° varsayım', q.x - th * 0.5, q.y - th * 1.5, th * 0.7, 0, false); } });
    if (info && info.unfixed.length) text('VARSAYIM', 'Gönye belirsiz: çapraz ölçülmeli', cx, cy - th * 3, th * 0.8, 0, true);
  });
  g(0, 'ENDSEC'); g(0, 'EOF'); return L.join('\r\n') + '\r\n';
}
