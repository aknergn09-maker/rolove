<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rölöve Kroki</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f2a37">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f5f7;--ink:#1f2a37;--mut:#6b7280;--acc:#0b7cc1;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--ink);color:#fff}
header .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:#e8ebf0;color:var(--ink);cursor:pointer}
button:active{filter:brightness(.92)}
button.p{background:var(--acc);color:#fff}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.45}
header button{background:#334155;color:#fff;padding:7px 10px}
#ble.ok{background:var(--ok)}#ble.busy{background:#a16207}#ble.bad{background:var(--bad)}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#fbfbfc}
#hint{position:absolute;left:8px;right:8px;top:8px;background:rgba(31,42,55,.88);color:#fff;border-radius:10px;padding:7px 10px;font-size:13.5px;pointer-events:none}
#hint:empty{display:none}
#toast{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:.95}
#flash{position:absolute;right:10px;bottom:12px;background:var(--ok);color:#fff;font-weight:700;font-size:20px;padding:6px 12px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
#flash.show{opacity:1}
#panel{background:var(--card);border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>button{flex:1;min-width:0;padding:10px 6px}
.info{font-size:13.5px;color:var(--mut)}
.info b{color:var(--ink)}
input[type=text],input[type=number],select{font:inherit;padding:9px 10px;border:1px solid #cbd5e1;border-radius:10px;min-width:0;background:#fff;color:var(--ink)}
.num{flex:1}
nav{display:flex;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:9px 4px;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:10}
.sheet.hidden{display:none}
.sheet .box{background:var(--card);width:100%;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));touch-action:pan-y;user-select:text;-webkit-user-select:text}
.box h3{margin:6px 0 8px;font-size:16px}
.box .row>button{flex:1 1 45%}
.box label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.list button{display:block;width:100%;text-align:left;margin:4px 0}
pre{font-size:12px;background:#f1f5f9;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:12px;background:#e2e8f0;color:var(--ink)}
.tag.ok{background:#dcfce7;color:var(--ok)}.tag.warn{background:#ffedd5;color:var(--warn)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="bMenu" aria-label="Menü">☰</button>
    <div class="t" id="title">Rölöve Kroki</div>
    <button id="ble">Lazer bağla</button>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="flash"></div>
  </div>
  <div id="panel"></div>
  <nav>
    <button data-tool="takip">Takip</button>
    <button data-tool="kroki">Kroki</button>
    <button data-tool="sec">Seç</button>
    <button id="bUndo" aria-label="Geri al">↶</button>
    <button id="bRedo" aria-label="Yinele">↷</button>
    <button id="bFit" aria-label="Sığdır">⤢</button>
  </nav>
</div>

<div class="sheet hidden" id="sheet"><div class="box" id="sheetBox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
/* ============ Sabitler ============ */
const SVC = '02a6c0d0-0451-4000-b000-fb3210111989';
const CHR = '02a6c0d1-0451-4000-b000-fb3210111989';
const AUTOSYNC = [0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A];
const LS_PROJ = 'rk_projects', LS_CUR = 'rk_current', LS_SET = 'rk_settings';
const PREFIXES = 'ABCDEFGHJKLMNPRSTUVYZ';
const deg = Math.PI / 180;

/* ============ Durum ============ */
const defaultSettings = { scaleDen: 50, defaultTurn: -90, autoAdvance: true, offset: 0, demo: false, closeTol: 0.02 };
let SET = Object.assign({}, defaultSettings, readJSON(LS_SET, {}));
let P = null;                // proje
let S = { tool: 'takip', active: null, sel: null, pendingTurn: SET.defaultTurn, lastMeasure: null };
let undoStack = [], redoStack = [];
let view = { s: 40, ox: 0, oy: 0 };   // px/m, ekran orijini (css px)
const bleLog = [];

function readJSON(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function newProject(name) { return { name: name || ('Proje ' + new Date().toLocaleDateString('tr-TR')), rooms: [], seq: 0, created: Date.now() }; }
function allProjects() { return readJSON(LS_PROJ, {}); }
function saveProject() {
  const all = allProjects(); P.saved = Date.now(); all[P.name] = P; writeJSON(LS_PROJ, all); localStorage.setItem(LS_CUR, P.name);
}
function loadInitial() {
  const all = allProjects(); const cur = localStorage.getItem(LS_CUR);
  P = (cur && all[cur]) ? all[cur] : newProject();
}

/* ============ Geometri ============ */
const norm180 = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; };
function roomPts(r) {
  const out = [[r.x0, r.y0]]; let x = r.x0, y = r.y0, h = r.h0; const hs = [];
  r.legs.forEach((L, i) => { if (i > 0) h += L.turn; hs.push(h); x += L.len * Math.cos(h * deg); y += L.len * Math.sin(h * deg); out.push([x, y]); });
  return { pts: out, heads: hs, lastHead: hs.length ? hs[hs.length - 1] : r.h0 };
}
function roomGap(r) { const { pts } = roomPts(r); const a = pts[0], b = pts[pts.length - 1]; return Math.hypot(b[0] - a[0], b[1] - a[1]); }
function polyArea(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
function roomById(id) { return P.rooms.find(r => r.id === id); }
function ptName(r, k) { const n = r.legs.length; if (r.closed && k === n) return r.prefix + '1'; return r.prefix + (k + 1); }
function legName(r, i) { return ptName(r, i) + '–' + ptName(r, i + 1); }
function fmt(v) { return v.toFixed(3); }
function turnText(t) { t = norm180(t); if (Math.abs(t) < 1e-9) return 'Düz'; return (t > 0 ? 'Sol ' : 'Sağ ') + (+Math.abs(t).toFixed(2)) + '°'; }
function parseNum(s) { s = String(s).trim().replace(',', '.'); const v = parseFloat(s); return isFinite(v) ? v : NaN; }

/* ============ Geri al / yinele ============ */
function snap() { undoStack.push(JSON.stringify(P)); if (undoStack.length > 150) undoStack.shift(); redoStack = []; }
function undo() { if (!undoStack.length) return toast('Geri alınacak işlem yok'); redoStack.push(JSON.stringify(P)); P = JSON.parse(undoStack.pop()); fixSel(); commit(false); }
function redo() { if (!redoStack.length) return toast('Yinelenecek işlem yok'); undoStack.push(JSON.stringify(P)); P = JSON.parse(redoStack.pop()); fixSel(); commit(false); }
function fixSel() {
  if (S.sel) { const r = roomById(S.sel.room); if (!r || (S.sel.type === 'leg' && S.sel.i >= r.legs.length) || (S.sel.type === 'pt' && S.sel.i > r.legs.length)) S.sel = null; }
  if (S.active && !roomById(S.active)) S.active = null;
}
function commit(doSnapshot) { saveProject(); render(); }

/* ============ Oda işlemleri ============ */
function freeSpot() {
  const bb = bbox(); if (!bb) return [0, 0]; return [bb[2] + 2, bb[1]];
}
function createRoom(x, y) {
  const prefix = PREFIXES[P.seq % PREFIXES.length] + (P.seq >= PREFIXES.length ? Math.floor(P.seq / PREFIXES.length) : '');
  P.seq++;
  const r = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), prefix, name: 'Oda ' + prefix, x0: x, y0: y, h0: 0, legs: [], closed: false };
  P.rooms.push(r); S.active = r.id; return r;
}
function activeRoom() { const r = S.active && roomById(S.active); return r && !r.closed ? r : null; }
function addLegTakip(len, measured) {
  snap();
  let r = activeRoom();
  if (!r) { const [x, y] = freeSpot(); r = createRoom(x, y); }
  r.legs.push({ len, turn: r.legs.length ? S.pendingTurn : 0, measured: !!measured });
  S.pendingTurn = SET.defaultTurn;
  S.sel = null;
  commit(); ensureVisible(roomPts(r).pts.slice(-1)[0]);
  const g = roomGap(r);
  if (r.legs.length >= 3 && g < 0.15) toast('Başlangıca yaklaştın (' + (g * 100).toFixed(1) + ' cm). Odayı kapat.');
}
function closeRoom(r) {
  if (!r || r.legs.length < 2) return toast('Kapatmak için en az 2 kenar gerekli');
  snap();
  const { pts, lastHead } = roomPts(r); const a = pts[pts.length - 1], b = pts[0];
  const gap = Math.hypot(b[0] - a[0], b[1] - a[1]);
  if (gap > 0.05) {
    const h = Math.atan2(b[1] - a[1], b[0] - a[0]) / deg;
    r.legs.push({ len: gap, turn: norm180(h - lastHead), measured: false });
    toast('Son kenar tahmini eklendi, lazerle ölç');
  }
  r.closed = true; S.active = null;
  const iu = r.legs.findIndex(L => !L.measured);
  S.sel = iu >= 0 ? { type: 'leg', room: r.id, i: iu } : null;
  if (iu >= 0 && S.tool !== 'sec') setTool('sec', true);
  commit();
}
function setLeg(r, i, len) {
  snap(); r.legs[i].len = len; r.legs[i].measured = true;
  if (SET.autoAdvance) {
    let j = -1;
    for (let k = 1; k <= r.legs.length; k++) { const q = (i + k) % r.legs.length; if (!r.legs[q].measured) { j = q; break; } }
    if (j >= 0) S.sel = { type: 'leg', room: r.id, i: j };
    else { S.sel = null; const g = roomGap(r); toast(r.closed ? 'Tüm kenarlar ölçüldü · kapanma ' + (g * 100).toFixed(1) + ' cm' : 'Tüm kenarlar ölçüldü'); }
  }
  commit();
}
function setTurn(r, i, t) { if (i <= 0 || i >= r.legs.length) return; snap(); r.legs[i].turn = norm180(t); commit(); }
function deleteLastLeg() { const r = activeRoom(); if (!r || !r.legs.length) return toast('Silinecek kenar yok'); snap(); r.legs.pop(); if (!r.legs.length) { P.rooms = P.rooms.filter(q => q !== r); S.active = null; } commit(); }
function deleteRoom(r) { if (!r) return; snap(); P.rooms = P.rooms.filter(q => q !== r); if (S.active === r.id) S.active = null; S.sel = null; commit(); }
function reopenRoom(r) { if (!r) return; snap(); r.closed = false; S.active = r.id; commit(); }

/* ============ Lazer ölçüsü ============ */
function onMeasure(raw, src) {
  const v = raw + (SET.offset || 0);
  S.lastMeasure = v; beep(); flash(fmt(v) + ' m');
  if (S.sel && S.sel.type === 'leg') { const r = roomById(S.sel.room); if (r) { setLeg(r, S.sel.i, v); return; } }
  if (S.tool === 'takip') { addLegTakip(v, true); return; }
  toast('Ölçü alındı: ' + fmt(v) + ' m · bir kenar seç');
  render();
}

/* ============ Bluetooth (Bosch GLM) ============ */
let bleDev = null, bleChr = null, bleWanted = false;
function setBle(state, text) { const b = $('#ble'); b.className = state; b.textContent = text; }
async function bleConnect() {
  if (bleDev && bleDev.gatt.connected) { if (confirm('Lazer bağlantısı kesilsin mi?')) { bleWanted = false; bleDev.gatt.disconnect(); } return; }
  if (!navigator.bluetooth) { alert('Bu tarayıcı Bluetooth desteklemiyor.\n\niPhone: Bluefy tarayıcısını kullan.\nAndroid: Chrome kullan.\n\nLazer olmadan da ölçüleri elle girebilirsin.'); return; }
  try {
    setBle('busy', 'Seçiliyor…');
    bleDev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SVC] });
    bleDev.addEventListener('gattserverdisconnected', onBleDisc);
    bleWanted = true; await bleSetup();
  } catch (e) { logBle('HATA ' + e.message); setBle('', 'Lazer bağla'); if (e.name !== 'NotFoundError') toast('Bağlanamadı: ' + e.message); }
}
async function bleSetup() {
  setBle('busy', 'Bağlanıyor…');
  const srv = await bleDev.gatt.connect();
  const svc = await srv.getPrimaryService(SVC);
  bleChr = await svc.getCharacteristic(CHR);
  bleChr.addEventListener('characteristicvaluechanged', onBleVal);
  await bleChr.startNotifications();
  await bleChr.writeValue(new Uint8Array(AUTOSYNC));
  logBle('Bağlandı: ' + (bleDev.name || 'isimsiz cihaz'));
  setBle('ok', 'Lazer ✓'); keepAwake(); toast('Lazer bağlandı');
}
async function onBleDisc() {
  logBle('Bağlantı koptu'); if (!bleWanted) { setBle('', 'Lazer bağla'); return; }
  setBle('bad', 'Yeniden…');
  for (let i = 0; i < 6; i++) { await sleep(800 * (i + 1)); try { await bleSetup(); return; } catch (e) { logBle('Deneme ' + (i + 1) + ': ' + e.message); } }
  setBle('bad', 'Lazer koptu'); toast('Lazer bağlantısı koptu, tekrar bağla');
}
function onBleVal(ev) {
  const dv = ev.target.value; const b = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  logBle('← ' + hex(b));
  const v = parseBosch(dv);
  if (v !== null) onMeasure(v, 'ble');
}
function parseBosch(dv) {
  // Ölçüm paketi: C0 55 <uzunluk> .. .. .. .. <float32 LE @7> ... <CRC>
  if (dv.byteLength < 11) return null;
  if (dv.getUint8(0) !== 0xC0 || dv.getUint8(1) !== 0x55 || dv.getUint8(2) < 0x08) return null;
  const v = dv.getFloat32(7, true);
  return (isFinite(v) && v > 0 && v < 250) ? v : null;
}
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0').toUpperCase()).join(' ');
function logBle(s) { bleLog.push(new Date().toLocaleTimeString('tr-TR') + '  ' + s); if (bleLog.length > 60) bleLog.shift(); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && bleDev && bleDev.gatt.connected) keepAwake(); });

/* ============ Ses / geri bildirim ============ */
let actx = null;
function beep() {
  try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 1320; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.09);
  } catch (e) {}
}
document.addEventListener('pointerdown', () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }, { once: true });
const $ = q => document.querySelector(q);
let toastT; function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
let flashT; function flash(s) { const f = $('#flash'); f.textContent = s; f.classList.add('show'); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('show'), 1200); }

/* ============ Çizim ============ */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect(); DPR = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); render();
}
const w2s = (x, y) => [view.ox + x * view.s, view.oy - y * view.s];
const s2w = (X, Y) => [(X - view.ox) / view.s, (view.oy - Y) / view.s];
function bbox() {
  let b = null;
  P.rooms.forEach(r => roomPts(r).pts.forEach(([x, y]) => { if (!b) b = [x, y, x, y]; else { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); } }));
  return b;
}
function fit() {
  const b = bbox();
  if (!b) { view.s = 40; view.ox = W / 2; view.oy = H / 2; return render(); }
  const w = Math.max(b[2] - b[0], 1), h = Math.max(b[3] - b[1], 1);
  view.s = Math.min((W - 80) / w, (H - 110) / h, 400);
  view.ox = W / 2 - (b[0] + b[2]) / 2 * view.s; view.oy = H / 2 + 20 + (b[1] + b[3]) / 2 * view.s; render();
}
function ensureVisible(p) { const [X, Y] = w2s(p[0], p[1]); if (X < 40 || X > W - 40 || Y < 60 || Y > H - 40) fit(); }

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  drawGrid();
  P.rooms.forEach(drawRoom);
  drawGhost();
  drawPlacing();
  updateHint(); renderPanel(); updateNav();
}
function drawGrid() {
  let step = 1; while (step * view.s < 22) step *= 5; while (step * view.s > 160) step /= 5;
  const [x0, y1] = s2w(0, 0), [x1, y0] = s2w(W, H);
  ctx.lineWidth = 1;
  for (let x = Math.floor(x0 / step) * step; x <= x1; x += step) { const [X] = w2s(x, 0); ctx.strokeStyle = Math.abs(x / (step * 5) - Math.round(x / (step * 5))) < 1e-6 ? '#e3e6ea' : '#f0f1f3'; ctx.beginPath(); ctx.moveTo(X, 0); ctx.lineTo(X, H); ctx.stroke(); }
  for (let y = Math.floor(y0 / step) * step; y <= y1; y += step) { const [, Y] = w2s(0, y); ctx.strokeStyle = Math.abs(y / (step * 5) - Math.round(y / (step * 5))) < 1e-6 ? '#e3e6ea' : '#f0f1f3'; ctx.beginPath(); ctx.moveTo(0, Y); ctx.lineTo(W, Y); ctx.stroke(); }
  // ölçek çubuğu
  const sb = step >= 1 ? step : step; const len = sb * view.s;
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, H - 14); ctx.lineTo(12 + len, H - 14); ctx.stroke();
  ctx.fillStyle = '#64748b'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left'; ctx.fillText((+sb.toFixed(3)) + ' m', 14 + len, H - 10);
}
function label(text, X, Y, ang, color, bg) {
  ctx.save(); ctx.translate(X, Y); let a = ang; if (a > Math.PI / 2 || a <= -Math.PI / 2) a += Math.PI; ctx.rotate(a);
  ctx.font = '600 12.5px -apple-system,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (bg) { const w = ctx.measureText(text).width + 6; ctx.fillStyle = bg; ctx.fillRect(-w / 2, -8, w, 16); }
  ctx.fillStyle = color; ctx.fillText(text, 0, 0); ctx.restore();
}
function drawRoom(r) {
  const { pts } = roomPts(r); const area = polyArea(pts.slice(0, -1));
  const inSide = (r.closed ? (area < 0 ? 1 : -1) : 1); // +1: sağ taraf iç
  // kenarlar
  r.legs.forEach((L, i) => {
    const a = w2s(...pts[i]), b = w2s(...pts[i + 1]);
    const sel = S.sel && S.sel.type === 'leg' && S.sel.room === r.id && S.sel.i === i;
    ctx.lineWidth = sel ? 6 : 3; ctx.setLineDash(L.measured ? [] : [8, 6]);
    ctx.strokeStyle = sel ? '#0b7cc1' : (L.measured ? '#1f2a37' : '#d97706');
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]);
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; const ang = Math.atan2(dy, dx);
    // ekran koordinatında sağ normal (y aşağı): (-dy, dx)
    const nx = -dy / l * inSide, ny = dx / l * inSide;
    const txt = (L.measured ? '' : '~') + fmt(L.len);

  else if (a === 'firstOpen') { for (const q of P.rooms) { const i = q.legs.findIndex(L => !L.measured); if (i >= 0) { S.sel = { type: 'leg', room: q.id, i }; break; } } render(); }
  else if (a === 'reopen') { reopenRoom(P.rooms[P.rooms.length - 1]); setTool('takip'); }
});

$('#sheetBox').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const m = b.dataset.m; const r = (S.sel && roomById(S.sel.room)) || activeRoom() || P.rooms[P.rooms.length - 1];

  else if (m === 'json') { await saveFile(safeName(P.name) + '.json', JSON.stringify(P, null, 1), 'application/json'); closeSheet(); }

  else if (m === 'open') {
    const all = allProjects(); const names = Object.keys(all).sort((a, b) => (all[b].saved || 0) - (all[a].saved || 0));
    openSheet('<h3>Projeler</h3><div class="list">' + names.map(n => `<button data-open="${esc(n)}">${esc(n)} <span class="tag">${all[n].rooms.length} oda</span></button>`).join('') + '</div><div class="row"><button data-m="close">Kapat</button></div>');
  }
  else if (b.dataset.open) { saveProject(); P = allProjects()[b.dataset.open]; undoStack = []; redoStack = []; S.active = null; S.sel = null; commit(); fit(); closeSheet(); }
  else if (m === 'rename') { const n = prompt('Proje adı', P.name); if (!n || n === P.name) return; const all = allProjects(); delete all[P.name]; writeJSON(LS_PROJ, all); P.name = n; commit(); closeSheet(); }
  else if (m === 'import') { $('#fileIn').click(); }
  else if (m === 'roomName') { if (!r) return; const n = prompt('Oda adı', r.name); if (n) { snap(); r.name = n; commit(); } closeSheet(); }
  else if (m === 'roomDel') { if (r && confirm(r.name + ' silinsin mi?')) { deleteRoom(r); } closeSheet(); }
  else if (m === 'saveSet') {
    SET.scaleDen = +$('#sScale').value; SET.defaultTurn = +$('#sTurn').value; SET.autoAdvance = $('#sAuto').checked; SET.demo = $('#sDemo').checked;
    const off = parseNum($('#sOff').value); SET.offset = isFinite(off) ? off : 0; const tol = parseNum($('#sTol').value); SET.closeTol = isFinite(tol) && tol > 0 ? tol / 100 : 0.02;
    S.pendingTurn = SET.defaultTurn; writeJSON(LS_SET, SET); closeSheet(); render(); toast('Ayarlar kaydedildi');

});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return; try {
    const d = JSON.parse(await f.text()); if (!d || !Array.isArray(d.rooms)) throw new Error('Geçersiz dosya');
    saveProject(); P = d; if (allProjects()[P.name] && !confirm('"' + P.name + '" zaten var, üzerine yazılsın mı?')) P.name += ' (yüklendi)';

  } catch (err) { alert('Dosya okunamadı: ' + err.message); } e.target.value = '';

const safeName = s => s.replace(/[\\/:*?"<>|]+/g, '_');
async function saveFile(name, data, mime) {
  const blob = new Blob([data], { type: mime });
  try { const file = new File([blob], name, { type: mime }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
}

/* ============ DXF (R12, ANSI_1254) ============ */
const CP1254 = { 'Ç': 0xC7, 'ç': 0xE7, 'Ğ': 0xD0, 'ğ': 0xF0, 'İ': 0xDD, 'ı': 0xFD, 'Ö': 0xD6, 'ö': 0xF6, 'Ş': 0xDE, 'ş': 0xFE, 'Ü': 0xDC, 'ü': 0xFC, '°': 0xB0, '²': 0xB2, '±': 0xB1, 'Â': 0xC2, 'â': 0xE2, 'Î': 0xCE, 'î': 0xEE, 'Û': 0xDB, 'û': 0xFB, '–': 0x96, 'Δ': 0x3F };
function toCp1254(str) { const out = new Uint8Array(str.length); for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); out[i] = c < 128 ? c : (CP1254[str[i]] || 0x3F); } return out; }
function buildDXF(p, set) {
  const th = set.scaleDen * 0.0025;          // kağıtta 2.5 mm
  const L = [];
  const g = (code, val) => { L.push(String(code).padStart(3, ' ')); L.push(String(val)); };
  const n4 = v => (Math.abs(v) < 5e-5 ? 0 : v).toFixed(4);
  const layers = [['DUVAR', 7], ['VARSAYIM', 1], ['OLCU', 3], ['NOKTA', 6], ['NOKTA_ADI', 6], ['YAZI', 2], ['KAPANMA', 1]];
  g(0, 'SECTION'); g(2, 'HEADER');
  g(9, '$ACADVER'); g(1, 'AC1009'); g(9, '$DWGCODEPAGE'); g(3, 'ANSI_1254');
  g(9, '$INSBASE'); g(10, '0.0'); g(20, '0.0'); g(30, '0.0');
  const bb = bboxOf(p) || [0, 0, 10, 10];
  g(9, '$EXTMIN'); g(10, n4(bb[0])); g(20, n4(bb[1])); g(30, '0.0');
  g(9, '$EXTMAX'); g(10, n4(bb[2])); g(20, n4(bb[3])); g(30, '0.0');
  g(9, '$TEXTSIZE'); g(40, n4(th)); g(9, '$PDMODE'); g(70, 34); g(9, '$PDSIZE'); g(40, n4(th * 0.6));
  g(0, 'ENDSEC');
  g(0, 'SECTION'); g(2, 'TABLES');
  g(0, 'TABLE'); g(2, 'LTYPE'); g(70, 2);
  g(0, 'LTYPE'); g(2, 'CONTINUOUS'); g(70, 0); g(3, 'Solid line'); g(72, 65); g(73, 0); g(40, '0.0');
  g(0, 'LTYPE'); g(2, 'DASHED'); g(70, 0); g(3, '__ __ __'); g(72, 65); g(73, 2); g(40, n4(th * 4)); g(49, n4(th * 2.5)); g(49, n4(-th * 1.5));
  g(0, 'ENDTAB');
  g(0, 'TABLE'); g(2, 'LAYER'); g(70, layers.length + 1);
  g(0, 'LAYER'); g(2, '0'); g(70, 0); g(62, 7); g(6, 'CONTINUOUS');
  layers.forEach(([n, c]) => { g(0, 'LAYER'); g(2, n); g(70, 0); g(62, c); g(6, n === 'VARSAYIM' || n === 'KAPANMA' ? 'DASHED' : 'CONTINUOUS'); });
  g(0, 'ENDTAB');
  g(0, 'TABLE'); g(2, 'STYLE'); g(70, 1); g(0, 'STYLE'); g(2, 'STANDARD'); g(70, 0); g(40, '0.0'); g(41, '1.0'); g(50, '0.0'); g(71, 0); g(42, n4(th)); g(3, 'txt'); g(4, ''); g(0, 'ENDTAB');
  g(0, 'ENDSEC');
  g(0, 'SECTION'); g(2, 'ENTITIES');
  const line = (lay, a, b) => { g(0, 'LINE'); g(8, lay); g(10, n4(a[0])); g(20, n4(a[1])); g(30, '0.0'); g(11, n4(b[0])); g(21, n4(b[1])); g(31, '0.0'); };
  const text = (lay, s, x, y, h, rot, center) => {
    g(0, 'TEXT'); g(8, lay); g(10, n4(x)); g(20, n4(y)); g(30, '0.0'); g(40, n4(h)); g(1, s); if (rot) g(50, rot.toFixed(3));
    if (center) { g(72, 1); g(11, n4(x)); g(21, n4(y)); g(31, '0.0'); g(73, 2); }
  };
  p.rooms.forEach(r => {
    const { pts } = roomPts(r); const n = pts.length; const area = polyArea(pts.slice(0, -1));
    const inSide = r.closed ? (area < 0 ? 1 : -1) : 1;
    r.legs.forEach((Lg, i) => {
      const a = pts[i], b = pts[i + 1]; line(Lg.measured ? 'DUVAR' : 'VARSAYIM', a, b);
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      // dünya koordinatında (y yukarı) sağ normal: (dy,-dx)
      const nx = dy / l * inSide, ny = -dx / l * inSide;
      let rot = Math.atan2(dy, dx) / deg; if (rot > 90 || rot <= -90) rot += 180; rot = (rot + 360) % 360;
      text(Lg.measured ? 'OLCU' : 'VARSAYIM', (Lg.measured ? '' : '~') + Lg.len.toFixed(3), (a[0] + b[0]) / 2 + nx * th * 1.2, (a[1] + b[1]) / 2 + ny * th * 1.2, th, rot, true);
    });
    pts.forEach((pt, k) => {
      if (r.closed && k === n - 1) return;
      g(0, 'POINT'); g(8, 'NOKTA'); g(10, n4(pt[0])); g(20, n4(pt[1])); g(30, '0.0');
      text('NOKTA_ADI', ptName(r, k), pt[0] + th * 0.5, pt[1] + th * 0.5, th * 0.8, 0, false);
    });
    if (r.closed) { const gp = roomGap(r); if (gp > 0.0005) { line('KAPANMA', pts[n - 1], pts[0]); text('KAPANMA', 'Kapanma ' + (gp * 100).toFixed(1) + ' cm', (pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2 - th * 1.5, th * 0.8, 0, true); } }
    if (r.legs.length >= 2) {
      let cx = 0, cy = 0; const m = r.closed ? n - 1 : n; for (let k = 0; k < m; k++) { cx += pts[k][0]; cy += pts[k][1]; } cx /= m; cy /= m;
      text('YAZI', r.name, cx, cy + th * 0.8, th * 1.4, 0, true);
      if (r.closed) text('YAZI', 'A=' + Math.abs(area).toFixed(2) + ' m²', cx, cy - th * 1.2, th, 0, true);
      const um = r.legs.filter(x => !x.measured).length; if (um) text('VARSAYIM', um + ' kenar ölçülmedi', cx, cy - th * 3, th * 0.8, 0, true);
    }
  });
  g(0, 'ENDSEC'); g(0, 'EOF');
  return L.join('\r\n') + '\r\n';
}
function bboxOf(p) { let b = null; p.rooms.forEach(r => roomPts(r).pts.forEach(([x, y]) => { if (!b) b = [x, y, x, y]; else { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); } })); return b; }
