<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rölöve Kroki</title>
<style>
:root{--bg:#0b0d10;--pan:#14181e;--pan2:#1c222a;--ln:#2a313b;--tx:#e6e9ee;--mu:#8d97a5;--ac:#3b82f6;--ok:#22c55e;--wa:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--pan);border-bottom:1px solid var(--ln);flex:0 0 auto}
#top .t{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--tx);background:var(--pan2);border:1px solid var(--ln);border-radius:10px;min-height:38px;padding:4px 10px;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.35}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.p{background:#1e3a5f;border-color:#2d5a91}
button.dng{color:#fca5a5}
.ib{width:40px;padding:0;font-size:18px}
#wrap{position:relative;flex:1 1 auto;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cmd{position:absolute;left:8px;right:56px;top:8px;background:rgba(20,24,30,.88);border:1px solid var(--ln);border-radius:8px;padding:5px 9px;font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;pointer-events:none;line-height:1.35}
#cmd b{color:#fff}#cmd .k{color:#60a5fa}
#fab{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#fab button{width:40px;height:40px;padding:0;border-radius:20px;font-size:15px;background:rgba(28,34,42,.92)}
#fab button.on{background:var(--ac)}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid var(--ln);color:#fff;padding:7px 12px;border-radius:10px;font-size:13px;max-width:88%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(20,24,30,.97);border-top:1px solid var(--ln);border-radius:14px 14px 0 0;padding:4px 8px 8px;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
#sheet:empty{display:none}
#sheet .hd{display:flex;justify-content:center;padding:2px 0 6px}
#sheet .hd span{width:38px;height:4px;border-radius:2px;background:#3b4552}
.row{display:flex;gap:5px;align-items:center;margin-top:5px}
.row>button{flex:1}
.inf{color:var(--mu);font-size:13px}
.val{font:600 17px ui-monospace,Menlo,monospace;color:#fff;background:#0f1318;border:1px solid var(--ln);border-radius:8px;padding:5px 10px;min-width:92px;text-align:right}
.val.act{border-color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.kp button{font-size:18px;font-weight:600;min-height:42px}
#bar{flex:0 0 auto;background:var(--pan);border-top:1px solid var(--ln);padding:5px 6px calc(6px + env(safe-area-inset-bottom))}
#cats{display:flex;gap:4px;margin-bottom:5px}
#cats button{flex:1;min-height:30px;font-size:13px;border-radius:8px;background:transparent;border-color:transparent;color:var(--mu)}
#cats button.on{background:var(--pan2);border-color:var(--ln);color:#fff}
#tools{display:flex;gap:5px}
#tools button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;min-height:54px}
#tools button i{font-style:normal;font-size:19px;line-height:22px}
#tools button small{font-size:11px;color:var(--mu)}
#tools button.on small{color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
#modal.hid{display:none}
#mbox{background:var(--pan);width:100%;max-height:85dvh;overflow:auto;border-radius:16px 16px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
#mbox h3{margin:12px 0 6px;font-size:14px;color:var(--mu);font-weight:600}
#mbox label{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
#mbox select,#mbox input[type=text]{background:var(--pan2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px}
.list button{display:block;width:100%;text-align:left;margin-top:5px}
#bMenu{position:relative}#bMenu.warn::after{content:'';position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:#ef4444}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="bMenu" aria-label="Menü">☰</button>
    <div class="t" id="title">Rölöve</div>
    <button class="ib" id="bUndo" aria-label="Geri al">↶</button>
    <button class="ib" id="bRedo" aria-label="Yinele">↷</button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="cmd"></div>
    <div id="fab">
      <button id="fOrtO" title="Objeye göre 90° kilit">⊥</button>
      <button id="fOrtX" title="X-Y eksen kilidi">✛</button>
      <button id="fSnap" title="Nesne yakalama">⌖</button>
      <button id="fFit" title="Tümünü göster">⤢</button>
    </div>
    <div id="toast"></div>
    <div id="sheet"></div>
  </div>
  <div id="bar">
    <div id="cats"></div>
    <div id="tools"></div>
  </div>
</div>
<div id="modal" class="hid"><div id="mbox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* =================== Sabitler, durum =================== */
const VER = 'v11.4';
const LS_P = 'rk3_projects', LS_C = 'rk3_current', LS_S = 'rk3_settings';
const deg = Math.PI / 180;
const defSet = { ortho: 'obj', snap: true, showLen: true, autoRoom: true, wallT: 0.2, wallSide: 1 };
const readJSON = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
let SET = Object.assign({}, defSet, readJSON(LS_S, {}));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const newProject = name => ({ v: 8, name: name || ('Kroki ' + new Date().toLocaleDateString('tr-TR')), nodes: [], lines: [], rooms: [], walls: [], roomSeq: 0, created: Date.now() });
let P = null;
const S = { ms: { sel: null, buf: '', pend: null }, op: { type: 'kapi', step: 1, f: 'w', d: '', w: '' }, pendOpen: null, mk: { mode: 'ciz', l1: null, l2: null, pts: [] }, elName: 'Kolon', cik: { mode: 'el', step: 1 }, offEdit: null, cat: 'ciz', tool: 'cizgi', sel: null, chain: null, kbuf: '', field: null, rect: { w: '', h: '', c1: null }, move: null, lenEdit: null, np: false, lastStroke: [] };
let G = { faces: [], comps: [] };
let undoSt = [], redoSt = [];
let view = { s: 40, ox: 0, oy: 0 };
let aim = null; // dokunma sırasında hedef
let W = 0, H = 0, DPR = 1;

/* =================== Yardımcılar =================== */
const $ = q => document.querySelector(q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nodeById = id => P.nodes.find(n => n.id === id);
const lineById = id => P.lines.find(l => l.id === id);
const roomById = id => P.rooms.find(r => r.id === id);
const nw = id => { const n = nodeById(id); return [n.x, n.y]; };
const V = { sub: (a, b) => [a[0] - b[0], a[1] - b[1]], add: (a, b) => [a[0] + b[0], a[1] + b[1]], mul: (a, k) => [a[0] * k, a[1] * k], len: a => Math.hypot(a[0], a[1]), dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]), unit: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; } };
const lineLen = l => V.dist(nw(l.a), nw(l.b));
const headDeg = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) / deg;
const norm90 = h => { let b = ((h % 90) + 90) % 90; if (b > 45) b -= 90; return b; };
const wrapPI = a => Math.atan2(Math.sin(a), Math.cos(a));
const fmtM = (v, d) => v.toFixed(d == null ? 2 : d);
const degreeOf = id => P.lines.filter(l => l.a === id || l.b === id).length;
function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1]; const l2 = dx * dx + dy * dy; if (!l2) return V.dist(p, a); let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2; t = Math.max(0, Math.min(1, t)); return Math.hypot(a[0] + t * dx - p[0], a[1] + t * dy - p[1]); }
function footT(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1]; const l2 = dx * dx + dy * dy || 1; const t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2; return { t, q: [a[0] + t * dx, a[1] + t * dy] }; }
function segX(a, b, c, d) { const r = V.sub(b, a), s = V.sub(d, c); const den = r[0] * s[1] - r[1] * s[0]; if (Math.abs(den) < 1e-12) return null; const t = ((c[0] - a[0]) * s[1] - (c[1] - a[1]) * s[0]) / den, u = ((c[0] - a[0]) * r[1] - (c[1] - a[1]) * r[0]) / den; return { t, u, p: [a[0] + t * r[0], a[1] + t * r[1]] }; }
function polyArea(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
function inPoly(p, pts) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if (((a[1] > p[1]) !== (b[1] > p[1])) && (p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0])) c = !c; } return c; }
function interiorPt(pts) {
  let cx = 0, cy = 0; pts.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= pts.length; cy /= pts.length;
  const a = polyArea(pts); if (Math.abs(a) > 1e-9) { let x = 0, y = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; const f = p[0] * q[1] - q[0] * p[1]; x += (p[0] + q[0]) * f; y += (p[1] + q[1]) * f; } const c = [x / (6 * a), y / (6 * a)]; if (inPoly(c, pts)) return c; }
  const ys = pts.map(p => p[1]); const y0 = Math.min(...ys), y1 = Math.max(...ys); let best = null;
  for (let k = 1; k < 12; k++) { const y = y0 + (y1 - y0) * k / 12; const xs = []; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; if ((p[1] > y) !== (q[1] > y)) xs.push(p[0] + (y - p[1]) * (q[0] - p[0]) / (q[1] - p[1])); } xs.sort((u, v) => u - v); for (let i = 0; i + 1 < xs.length; i += 2) { const w = xs[i + 1] - xs[i]; if (!best || w > best.w) best = { w, p: [(xs[i] + xs[i + 1]) / 2, y] }; } }
  return best ? best.p : [cx, cy];
}

/* =================== Proje, geri al =================== */
function uniqName(n) { const all = allProjects(); if (!all[n]) return n; let k = 2; while (all[n + ' (' + k + ')']) k++; return n + ' (' + k + ')'; }
function allProjects() { return readJSON(LS_P, {}); }
function needBackup() { return P && P.lines.length > 0 && (P.saved || 0) - (P.backupAt || 0) > 30 * 60 * 1000; }
function markBackup() { const b = document.getElementById('bMenu'); if (b) b.classList.toggle('warn', needBackup()); }
function backupInfo() { if (!P.backupAt) return 'Bu projenin hiç yedeği yok'; const m = Math.round((Date.now() - P.backupAt) / 60000); return 'Son yedek: ' + (m < 60 ? m + ' dk' : m < 1440 ? Math.round(m / 60) + ' saat' : Math.round(m / 1440) + ' gün') + ' önce' + (P.saved > P.backupAt ? ' (sonra değişti)' : ''); }
let saveErr = 0;
function save() { const all = allProjects(); P.saved = Date.now(); all[P.name] = P; const ok = writeJSON(LS_P, all); try { localStorage.setItem(LS_C, P.name); } catch (e) {} if (!ok) { if (Date.now() - saveErr > 20000) { saveErr = Date.now(); alert('KAYDEDİLEMEDİ! Telefon hafızası dolu olabilir.\nHemen ☰ → JSON yedek al.'); } } else saveErr = 0; markBackup(); }
function loadInitial() { const all = allProjects(); const c = localStorage.getItem(LS_C); P = (c && all[c] && all[c].v === 8) ? all[c] : newProject(); if (!all[P.name]) P.name = uniqName(P.name); P.walls = P.walls || []; }
function snap() { undoSt.push(JSON.stringify(P)); if (undoSt.length > 200) undoSt.shift(); redoSt = []; }
function undo() { if (!undoSt.length) return toast('Geri alınacak işlem yok'); S.cikAsk = null; S.faceAsk = null; redoSt.push(JSON.stringify(P)); P = JSON.parse(undoSt.pop()); afterLoad(); commit(); }
function redo() { if (!redoSt.length) return toast('Yinelenecek işlem yok'); undoSt.push(JSON.stringify(P)); P = JSON.parse(redoSt.pop()); afterLoad(); commit(); }
function afterLoad() { P.walls = P.walls || []; try { P.lines = P.lines.filter(l => { if (!l.face || l.keep || l.step) return true; const A = nodeById(l.a), B = nodeById(l.b); if (!A || !B) return true; const qa = quadAt([A.x, A.y]), qb = quadAt([B.x, B.y]); return !(qa && qb && qa.face && qb.face && qa.w === qb.w && (qa.i === qb.i || segDist([(A.x + B.x) / 2, (A.y + B.y) / 2], qa.fa, qa.fb) < 1e-4 || segDist([(A.x + B.x) / 2, (A.y + B.y) / 2], qb.fa, qb.fb) < 1e-4)); }); } catch (e) {} try { (P.fills || []).forEach(killUnderFill); } catch (e) {} if (S.chain && !nodeById(S.chain.last)) S.chain = null; if (S.sel) S.sel = null; S.move = null; S.lenEdit = null; }
function commit() { regenSteps(); cleanup(); regenOpenings(); G = computeFaces(); updateRooms(); save(); render(); }

/* =================== Model işlemleri =================== */
function addNode(x, y) { const id = uid('n'); P.nodes.push({ id, x, y }); return id; }
function findLine(a, b) { return P.lines.find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a)); }
function addLine(a, b, kind) { if (a === b) return null; const ex = findLine(a, b); if (ex) return ex; const l = { id: uid('l'), a, b, kind: kind || 'sketch' }; P.lines.push(l); return l; }
function splitLine(l, nid) { // l çizgisini nid düğümünde böl
  (P.walls || []).forEach(w => { const n = w.nodes.length; for (let i = 0; i < (w.closed ? n : n - 1); i++) { const x = w.nodes[i], y = w.nodes[(i + 1) % n]; if ((x === l.a && y === l.b) || (x === l.b && y === l.a)) { w.nodes.splice(i + 1, 0, nid); break; } } });
  P.lines = P.lines.filter(x => x !== l); const l1 = addLine(l.a, nid, l.kind), l2 = addLine(nid, l.b, l.kind); if (l.m != null && l1 && l2) { const a = lineLen(l1), b = lineLen(l2); l1.m = l.m * a / (a + b); l2.m = l.m - l1.m; } return [l1, l2];
}
function regenSteps() { // basamaklar her seferinde kenarlarından yeniden üretilir; merdiven silinirse gider, çerçeve taşınırsa izler
  P.arrows = P.arrows || []; P.stepSets = P.stepSets || []; const hasR = id => !id || P.rooms.some(r => r.id === id && r.kind === 'merdiven');
  P.stepSets = P.stepSets.filter(t => [t.a, t.b, t.c, t.d].every(nodeById) && hasR(t.stair));
  P.lines = P.lines.filter(l => !l.step);
  P.stepSets.forEach(t => { const a1 = nw(t.a), b1 = nw(t.b), c = nw(t.c), d = nw(t.d); if (V.dist(a1, b1) < 1e-6 || V.dist(c, d) < 1e-6) return; const u = V.unit(V.sub(b1, a1)), nr = [-u[1], u[0]];
    for (let i = 0; i < t.N; i++) { const p = V.add(a1, V.mul(V.sub(b1, a1), i / (t.N - 1))); const q = lineInt(p, nr, c, V.unit(V.sub(d, c))); if (!q || V.dist(p, q) < 1e-4) continue;
      if (P.lines.some(l => !l.step && ((V.dist(nw(l.a), p) < 1e-4 && V.dist(nw(l.b), q) < 1e-4) || (V.dist(nw(l.a), q) < 1e-4 && V.dist(nw(l.b), p) < 1e-4)))) continue;
      P.lines.push({ id: uid('l'), a: addNode(...p), b: addNode(...q), kind: 'sketch', step: t.id }); } });
  P.arrows = P.arrows.filter(a => { if (a.stair && !hasR(a.stair)) return false; if (a.ref) { const n = nodeById(a.ref); if (!n) return !a.stair; const dx = n.x - a.rx, dy = n.y - a.ry; if (dx || dy) { a.pts = a.pts.map(p => [p[0] + dx, p[1] + dy]); a.rx = n.x; a.ry = n.y; } } return true; });
}
function cleanup() { // sıfır boy, çift çizgi, yetim düğüm
  P.arrows = P.arrows || [];
  P.lines = P.lines.filter(l => l.a !== l.b && nodeById(l.a) && nodeById(l.b));
  const seen = new Set(); P.lines = P.lines.filter(l => { const k = [l.a, l.b].sort().join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
  const used = new Set(); P.lines.forEach(l => { used.add(l.a); used.add(l.b); });
  P.nodes = P.nodes.filter(n => used.has(n.id) || (S.chain && (S.chain.first === n.id || S.chain.last === n.id)) || (S.move && S.move.keep === n.id));
  P.walls = (P.walls || []).filter(w => { w.nodes = w.nodes.filter(id => nodeById(id)); for (let i = w.nodes.length - 1; i > 0; i--) if (w.nodes[i] === w.nodes[i - 1]) w.nodes.splice(i, 1); return w.nodes.length >= 2; });
}
function mergeNodes(keep, drop) { if (keep === drop) return; (P.openings || []).forEach(o => { if (o.ha === drop) o.ha = keep; if (o.hb === drop) o.hb = keep; }); (P.stepSets || []).forEach(t => ['a', 'b', 'c', 'd'].forEach(k => { if (t[k] === drop) t[k] = keep; })); (P.arrows || []).forEach(a => { if (a.ref === drop) a.ref = keep; }); P.lines.forEach(l => { if (l.a === drop) l.a = keep; if (l.b === drop) l.b = keep; }); (P.walls || []).forEach(w => { w.nodes = w.nodes.map(x => x === drop ? keep : x); if (S.chain && S.chain.nodes) S.chain.nodes = S.chain.nodes.map(x => x === drop ? keep : x); }); P.nodes = P.nodes.filter(n => n.id !== drop); if (S.chain) { if (S.chain.first === drop) S.chain.first = keep; if (S.chain.last === drop) S.chain.last = keep; } }
function deleteNode(id) { // kırığı sil
  const ls = P.lines.filter(l => l.a === id || l.b === id);
  if (ls.length === 2) { const o = ls.map(l => l.a === id ? l.b : l.a); const A = nw(o[0]), B = nw(o[1]), C = nw(id); const col = Math.abs(wrapPI((headDeg(A, C) - headDeg(C, B)) * deg)) < 1 * deg; const kind = col && ls.every(l => l.kind === 'typed') ? 'typed' : 'sketch'; P.lines = P.lines.filter(l => !ls.includes(l)); addLine(o[0], o[1], kind); }
  else P.lines = P.lines.filter(l => !ls.includes(l));
  P.nodes = P.nodes.filter(n => n.id !== id);
}
function deleteLine(l) { if (l.step) P.stepSets = (P.stepSets || []).filter(t => t.id !== l.step); P.lines = P.lines.filter(x => x !== l); }

/* =================== Alan (oda) algılama: düzlemsel graf yüzleri =================== */
function computeFaces(realOnly) {
  const vk = new Map(), verts = []; const key = p => Math.round(p[0] * 1e5) + '|' + Math.round(p[1] * 1e5);
  const vid = p => { const k = key(p); if (vk.has(k)) return vk.get(k); const i = verts.length; verts.push({ x: p[0], y: p[1], out: [] }); vk.set(k, i); return i; };
  const segs = P.lines.filter(l => !l.step).map(l => ({ a: nw(l.a), b: nw(l.b), l, ts: [{ t: 0, p: nw(l.a) }, { t: 1, p: nw(l.b) }] }));

    if (a === 'ophg') o.hinge = o.hinge ? 0 : 1; else if (a === 'ophand') setHand(o, b.dataset.v); else if (a === 'opsw') { const h0 = doorHand(o); o.sw = -o.sw; setHand(o, h0); } else if (a === 'opty') o.type = o.type === 'kapi' ? 'pencere' : 'kapi';
    else { const W0 = kval(); const A = nw(o.ha), B = nw(o.hb); const u = V.unit(V.sub(B, A)); const nx = P.lines.find(l => (l.a === o.hb || l.b === o.hb) && !(l.a === o.ha || l.b === o.ha) && isCol(l, u)); const room = nx ? lineLen(nx) : 0;
      if (!(W0 > 0) || W0 - o.w > room - 0.01) { undoSt.pop(); return toast('Genişlik duvara sığmıyor'); } const n = nodeById(o.hb); const q = V.add(A, V.mul(u, W0)); n.x = q[0]; n.y = q[1]; S.kbuf = ''; S.np = false; }
    commit(); return; }
  else if (a === 'mkm') { if (S.chain) finishChain(); S.mk = { mode: b.dataset.v, l1: null, l2: null, pts: [] }; S.sel = null; S.kbuf = ''; }
  else if (a === 'eln') S.elName = b.dataset.v;
  else if (a === 'elx') { const n = prompt('Eleman adı', S.elName); if (n && n.trim()) S.elName = n.trim(); }
  else if (a === 'mkr') { S.mk.l1 = S.mk.l2 = null; S.sel = null; }
  else if (a === 'stp') { stepsApply(); return; }
  else if (a === 'yonb') S.mk.pts.pop();
  else if (a === 'yonx') S.mk.pts = [];
  else if (a === 'yonok') { if (S.mk.pts.length >= 2) { snap(); const pts = S.mk.pts.slice(); const st = P.rooms.find(r => r.kind === 'merdiven' && r._f && pts.some(p => inPoly(p, r._f.poly))); const rl = st && [...st._f.lids].map(id => lineById(id)).find(Boolean); const rn = rl ? nodeById(rl.a) : null; P.arrows.push({ id: uid('a'), pts, stair: st ? st.id : null, ref: rn ? rn.id : null, rx: rn ? rn.x : 0, ry: rn ? rn.y : 0 }); S.mk.pts = []; commit(); toast('Çıkış yönü çizildi'); return; } }
  else if (a === 'ar') { arrowAdd(+b.dataset.v); return; }
  else if (a === 'back') { chainBack(); return; }
  else if (a === 'close') { if (S.chain) chainAdd({ type: 'end', node: S.chain.first, X: 0, Y: 0 }, 'sketch'); return; }
  else if (a === 'end') { finishChain(); toast('Çizgi bitti'); return; }
  else if (a === 'fld') { S.field = b.dataset.v; S.np = true; }
  else if (a === 'wt') { SET.wallT = +b.dataset.v; writeJSON(LS_S, SET); const ws = recentWalls(); if (ws.length) { snap(); ws.forEach(w => w.t = SET.wallT); commit(); toast('Son duvar ' + Math.round(SET.wallT * 100) + ' cm'); return; } }
  else if (a === 'wstroke') { const ws = wallsFromLines(S.lastStroke.filter(id => lineById(id))); toast(ws ? 'Duvar eklendi · ' + Math.round(SET.wallT * 100) + ' cm · ⇄ için duvara dokun (Seç)' : 'Duvar eklenemedi'); return; }
  else if (a === 'closeSel') { closeSelected(); return; }
  else if (a === 'ofs') { S.offEdit = { id: S.sel.lines[0] }; S.kbuf = ''; S.np = true; }
  else if (a === 'ofsx') { S.offEdit = null; S.kbuf = ''; }
  else if (a === 'ofsgo') { const d = kval(); if (d == null) return toast('Önce mesafeyi yaz (cm)'); offsetWall(S.offEdit.id, +b.dataset.v, d); S.offEdit = null; S.kbuf = ''; S.np = false; render(); return; }
  else if (a === 'cikm') { if (S.chain) finishChain(); S.cik = { mode: b.dataset.v, step: 1 }; S.kbuf = ''; }
  else if (a === 'cikx') { S.cik = { mode: S.cik.mode, step: 1 }; S.kbuf = ''; }
  else if (a === 'cikw') { cikWidth(+b.dataset.v); return; }
  else if (a === 'cikd') { cikApply(+b.dataset.v); return; }
  else if (a === 'askY') { applyOuterAsk(); render(); return; }
  else if (a === 'skN') { S.strokeAsk = null; }
  else if (a === 'skY') { const k = S.strokeAsk; S.strokeAsk = null; if (!k) return; const a0 = k.ids[0], b0 = k.ids[k.ids.length - 1]; snap(); P.rooms = P.rooms.filter(r => !(k.rooms || []).includes(r.id)); const pre = outerPre(a0, b0, k.lids) || outerPreCorner(a0, b0, k.ids, k.lids); if (!applyDetour(a0, b0, k.ids, k.lids)) { P = JSON.parse(undoSt.pop()); render(); return toast('Bu çizim çıkıntı yapılamadı (aradaki çizgi başka odanın sınırı)'); } commit(); prepareOuterAsk(pre, a0, b0, k.ids); render(); toast('Çıkıntı odaya katıldı' + (S.cikAsk ? ' · dış yüz için aşağıdan seç' : '')); return; }
  else if (a === 'faY' || a === 'faN') { const k = S.faceAsk, want = a === 'faY' ? 'kayar' : 'sabit'; if (k && k[want] && k.cur !== want) { snap(); P = JSON.parse(k[want]); k.cur = want; commit(); } toast(want === 'kayar' ? 'Turuncu çizgi kaydı, duvar kalınlığı korundu' : 'Turuncu çizgi sabit · duvar çizdiğin yere kadar kalınlaştı'); }
  else if (a === 'askN') { const k = S.cikAsk; S.cikAsk = null; if (k && k.nb) { snap(); k.nb.forEach(([p, q]) => { const l = addLine(nodeAt(p), nodeAt(q), 'sketch'); if (l) l.keep = true; }); commit(); } toast('Dış yüz sabit kaldı'); }
  else if (a === 'wsplit') { const w = selWall(); if (!w) return; const g = wallGeom(w); snap(); const id = q => { const ex = P.nodes.find(n => Math.hypot(n.x - q[0], n.y - q[1]) < 1e-4); return ex ? ex.id : addNode(q[0], q[1]); }; wallFaces().filter(f => f.w.id === w.id).forEach(f => addLine(id(f.a), id(f.b), 'sketch')); P.walls = P.walls.filter(x => x !== w); S.sel = null; commit(); toast('Duvarın diğer yüzü bağımsız çizgiler oldu'); return; }
  else if (a === 'mkwall') { let ids = []; if (S.sel.room) { const r = roomById(S.sel.room); ids = r && r._f ? [...r._f.lids] : []; } else ids = (S.sel.lines || []).slice(); const one = !S.sel.room && ids.length === 1; const ws = wallsFromLines(ids, one); if (ws) { S.sel = { wall: ws[0].id }; render(); toast('Duvar eklendi · kalınlık ve ⇄ Yön aşağıda'); } else toast('Duvar eklenemedi'); return; }
  else if (a === 'wside') { const ws = recentWalls(); if (ws.length) { snap(); ws.forEach(w => w.side = -w.side); commit(); toast('Son duvarın yönü değişti'); return; } SET.wallSide = -SET.wallSide; writeJSON(LS_S, SET); }

  else if (a === 'sside') { const w = selWall(); if (!w) return; snap(); w.side = -w.side; commit(); return; }
  else if (a === 'rclr') { S.rect.w = ''; S.rect.h = ''; }
  else if (a === 'unsel') { S.sel = null; }
  else if (a === 'del') { delSel(); return; }
  else if (a === 'mv') { S.move = { base: null }; S.kbuf = ''; }
  else if (a === 'mvx') { S.move = null; S.kbuf = ''; }
  else if (a === 'len') { S.lenEdit = { id: S.sel.lines[0], fix: 'A' }; S.kbuf = ''; }
  else if (a === 'fix') S.lenEdit.fix = b.dataset.v;
  else if (a === 'lenx') { S.lenEdit = null; S.kbuf = ''; }
  else if (a === 'lenok') { applyLen(); return; }
  else if (a === 'cont') { const id = S.sel.nodes[0]; setTool('cizgi'); S.chain = { first: id, last: id, n: 0, lines: [], firstLine: null, nodes: [id] }; render(); toast('Bu köşeden devam'); return; }
  else if (a === 'rname') { const r = roomById(S.sel.room); const n = prompt('Oda adı', r.name); if (n) { snap(); r.name = n.trim(); commit(); return; } }
  render();

$('#fOrtO').onclick = () => { SET.ortho = SET.ortho === 'obj' ? 'off' : 'obj'; writeJSON(LS_S, SET); toast(SET.ortho === 'obj' ? '90° kilit: çizdiğin objeye göre' : 'Kilit kapalı'); render(); };

/* ---- Dokunmatik düğmeler: tarayıcının yuttuğu "click" yerine doğrudan dokunmaya tepki ---- */
let tapDown = null, lastTapT = 0;
const bsig = b => (b.id || '') + '|' + JSON.stringify(b.dataset) + '|' + b.textContent;
document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('button'); tapDown = b ? { sig: bsig(b), x: e.clientX, y: e.clientY } : null; }, true);
document.addEventListener('pointerup', e => { const b = e.target.closest && e.target.closest('button'); const d = tapDown; tapDown = null; if (!d || !b || b.disabled) return; if (bsig(b) !== d.sig || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14) return; lastTapT = Date.now(); b.click(); }, true);

$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && Date.now() - modalAt > 600) closeModal(); }); // açan dokunuşun ikinci tıklaması kapatmasın
$('#bMenu').onclick = () => openModal(`<h3>${esc(P.name)}</h3>
