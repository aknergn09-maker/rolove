<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rölöve Kroki</title>
<style>
:root{--bg:#0b0d10;--pan:#14181e;--pan2:#1c222a;--ln:#2a313b;--tx:#e6e9ee;--mu:#8d97a5;--ac:#3b82f6;--ok:#22c55e;--wa:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--pan);border-bottom:1px solid var(--ln);flex:0 0 auto}
#top .t{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--tx);background:var(--pan2);border:1px solid var(--ln);border-radius:10px;min-height:38px;padding:4px 10px;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.35}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.p{background:#1e3a5f;border-color:#2d5a91}
button.dng{color:#fca5a5}
.ib{width:40px;padding:0;font-size:18px}
#wrap{position:relative;flex:1 1 auto;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cmd{position:absolute;left:8px;right:56px;top:8px;background:rgba(20,24,30,.88);border:1px solid var(--ln);border-radius:8px;padding:5px 9px;font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;pointer-events:none;line-height:1.35}
#cmd b{color:#fff}#cmd .k{color:#60a5fa}
#fab{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#fab button{width:40px;height:40px;padding:0;border-radius:20px;font-size:15px;background:rgba(28,34,42,.92)}
#fab button.on{background:var(--ac)}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid var(--ln);color:#fff;padding:7px 12px;border-radius:10px;font-size:13px;max-width:88%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(20,24,30,.97);border-top:1px solid var(--ln);border-radius:14px 14px 0 0;padding:4px 8px 8px;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
#sheet:empty{display:none}
#sheet .hd{display:flex;justify-content:center;padding:2px 0 6px}
#sheet .hd span{width:38px;height:4px;border-radius:2px;background:#3b4552}
.row{display:flex;gap:5px;align-items:center;margin-top:5px}
.row>button{flex:1}
.inf{color:var(--mu);font-size:13px}
.val{font:600 17px ui-monospace,Menlo,monospace;color:#fff;background:#0f1318;border:1px solid var(--ln);border-radius:8px;padding:5px 10px;min-width:92px;text-align:right}
.val.act{border-color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.kp button{font-size:18px;font-weight:600;min-height:42px}
#bar{flex:0 0 auto;background:var(--pan);border-top:1px solid var(--ln);padding:5px 6px calc(6px + env(safe-area-inset-bottom))}
#cats{display:flex;gap:4px;margin-bottom:5px}
#cats button{flex:1;min-height:30px;font-size:13px;border-radius:8px;background:transparent;border-color:transparent;color:var(--mu)}
#cats button.on{background:var(--pan2);border-color:var(--ln);color:#fff}
#tools{display:flex;gap:5px}
#tools button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;min-height:54px}
#tools button i{font-style:normal;font-size:19px;line-height:22px}
#tools button small{font-size:11px;color:var(--mu)}
#tools button.on small{color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
#modal.hid{display:none}
#mbox{background:var(--pan);width:100%;max-height:85dvh;overflow:auto;border-radius:16px 16px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
#mbox h3{margin:12px 0 6px;font-size:14px;color:var(--mu);font-weight:600}
#mbox label{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
#mbox select,#mbox input[type=text]{background:var(--pan2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px}
.list button{display:block;width:100%;text-align:left;margin-top:5px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="bMenu" aria-label="Menü">☰</button>
    <div class="t" id="title">Rölöve</div>
    <button class="ib" id="bUndo" aria-label="Geri al">↶</button>
    <button class="ib" id="bRedo" aria-label="Yinele">↷</button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="cmd"></div>
    <div id="fab">
      <button id="fOrtO" title="Objeye göre 90° kilit">⊥</button>
      <button id="fOrtX" title="X-Y eksen kilidi">✛</button>
      <button id="fSnap" title="Nesne yakalama">⌖</button>
      <button id="fFit" title="Tümünü göster">⤢</button>
    </div>
    <div id="toast"></div>
    <div id="sheet"></div>
  </div>
  <div id="bar">
    <div id="cats"></div>
    <div id="tools"></div>
  </div>
</div>
<div id="modal" class="hid"><div id="mbox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* =================== Sabitler, durum =================== */
const LS_P = 'rk3_projects', LS_C = 'rk3_current', LS_S = 'rk3_settings';
const deg = Math.PI / 180;
const defSet = { ortho: 'obj', snap: true, showLen: true, autoRoom: true };
const readJSON = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let SET = Object.assign({}, defSet, readJSON(LS_S, {}));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const newProject = name => ({ v: 8, name: name || ('Kroki ' + new Date().toLocaleDateString('tr-TR')), nodes: [], lines: [], rooms: [], roomSeq: 0, created: Date.now() });
let P = null;
const S = { cat: 'ciz', tool: 'cizgi', sel: null, chain: null, kbuf: '', field: null, rect: { w: '', h: '', c1: null }, move: null, lenEdit: null, np: true };
let G = { faces: [], comps: [] };
let undoSt = [], redoSt = [];
let view = { s: 40, ox: 0, oy: 0 };
let aim = null; // dokunma sırasında hedef
let W = 0, H = 0, DPR = 1;

/* =================== Yardımcılar =================== */
const $ = q => document.querySelector(q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nodeById = id => P.nodes.find(n => n.id === id);
const lineById = id => P.lines.find(l => l.id === id);
const roomById = id => P.rooms.find(r => r.id === id);
const nw = id => { const n = nodeById(id); return [n.x, n.y]; };
const V = { sub: (a, b) => [a[0] - b[0], a[1] - b[1]], add: (a, b) => [a[0] + b[0], a[1] + b[1]], mul: (a, k) => [a[0] * k, a[1] * k], len: a => Math.hypot(a[0], a[1]), dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]), unit: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; } };
const lineLen = l => V.dist(nw(l.a), nw(l.b));
const headDeg = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) / deg;
const norm90 = h => { let b = ((h % 90) + 90) % 90; if (b > 45) b -= 90; return b; };
const wrapPI = a => Math.atan2(Math.sin(a), Math.cos(a));
const fmtM = (v, d) => v.toFixed(d == null ? 2 : d);
const degreeOf = id => P.lines.filter(l => l.a === id || l.b === id).length;
function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1]; const l2 = dx * dx + dy * dy; if (!l2) return V.dist(p, a); let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2; t = Math.max(0, Math.min(1, t)); return Math.hypot(a[0] + t * dx - p[0], a[1] + t * dy - p[1]); }
function footT(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1]; const l2 = dx * dx + dy * dy || 1; const t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2; return { t, q: [a[0] + t * dx, a[1] + t * dy] }; }
function segX(a, b, c, d) { const r = V.sub(b, a), s = V.sub(d, c); const den = r[0] * s[1] - r[1] * s[0]; if (Math.abs(den) < 1e-12) return null; const t = ((c[0] - a[0]) * s[1] - (c[1] - a[1]) * s[0]) / den, u = ((c[0] - a[0]) * r[1] - (c[1] - a[1]) * r[0]) / den; return { t, u, p: [a[0] + t * r[0], a[1] + t * r[1]] }; }
function polyArea(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
function inPoly(p, pts) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if (((a[1] > p[1]) !== (b[1] > p[1])) && (p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0])) c = !c; } return c; }
function interiorPt(pts) {
  let cx = 0, cy = 0; pts.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= pts.length; cy /= pts.length;
  const a = polyArea(pts); if (Math.abs(a) > 1e-9) { let x = 0, y = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; const f = p[0] * q[1] - q[0] * p[1]; x += (p[0] + q[0]) * f; y += (p[1] + q[1]) * f; } const c = [x / (6 * a), y / (6 * a)]; if (inPoly(c, pts)) return c; }
  const ys = pts.map(p => p[1]); const y0 = Math.min(...ys), y1 = Math.max(...ys); let best = null;
  for (let k = 1; k < 12; k++) { const y = y0 + (y1 - y0) * k / 12; const xs = []; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; if ((p[1] > y) !== (q[1] > y)) xs.push(p[0] + (y - p[1]) * (q[0] - p[0]) / (q[1] - p[1])); } xs.sort((u, v) => u - v); for (let i = 0; i + 1 < xs.length; i += 2) { const w = xs[i + 1] - xs[i]; if (!best || w > best.w) best = { w, p: [(xs[i] + xs[i + 1]) / 2, y] }; } }
  return best ? best.p : [cx, cy];
}

/* =================== Proje, geri al =================== */
function allProjects() { return readJSON(LS_P, {}); }
function save() { const all = allProjects(); P.saved = Date.now(); all[P.name] = P; writeJSON(LS_P, all); localStorage.setItem(LS_C, P.name); }
function loadInitial() { const all = allProjects(); const c = localStorage.getItem(LS_C); P = (c && all[c] && all[c].v === 8) ? all[c] : newProject(); }
function snap() { undoSt.push(JSON.stringify(P)); if (undoSt.length > 200) undoSt.shift(); redoSt = []; }
function undo() { if (!undoSt.length) return toast('Geri alınacak işlem yok'); redoSt.push(JSON.stringify(P)); P = JSON.parse(undoSt.pop()); afterLoad(); commit(); }
function redo() { if (!redoSt.length) return toast('Yinelenecek işlem yok'); undoSt.push(JSON.stringify(P)); P = JSON.parse(redoSt.pop()); afterLoad(); commit(); }
function afterLoad() { if (S.chain && !nodeById(S.chain.last)) S.chain = null; if (S.sel) S.sel = null; S.move = null; S.lenEdit = null; }
function commit() { cleanup(); G = computeFaces(); updateRooms(); save(); render(); }

/* =================== Model işlemleri =================== */
function addNode(x, y) { const id = uid('n'); P.nodes.push({ id, x, y }); return id; }
function findLine(a, b) { return P.lines.find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a)); }
function addLine(a, b, kind) { if (a === b) return null; const ex = findLine(a, b); if (ex) return ex; const l = { id: uid('l'), a, b, kind: kind || 'sketch' }; P.lines.push(l); return l; }
function splitLine(l, nid) { // l çizgisini nid düğümünde böl
  P.lines = P.lines.filter(x => x !== l); const l1 = addLine(l.a, nid, l.kind), l2 = addLine(nid, l.b, l.kind); return [l1, l2];
}
function cleanup() { // sıfır boy, çift çizgi, yetim düğüm
  P.lines = P.lines.filter(l => l.a !== l.b && nodeById(l.a) && nodeById(l.b));
  const seen = new Set(); P.lines = P.lines.filter(l => { const k = [l.a, l.b].sort().join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
  const used = new Set(); P.lines.forEach(l => { used.add(l.a); used.add(l.b); });
  P.nodes = P.nodes.filter(n => used.has(n.id) || (S.chain && (S.chain.first === n.id || S.chain.last === n.id)) || (S.move && S.move.keep === n.id));
}
function mergeNodes(keep, drop) { if (keep === drop) return; P.lines.forEach(l => { if (l.a === drop) l.a = keep; if (l.b === drop) l.b = keep; }); P.nodes = P.nodes.filter(n => n.id !== drop); if (S.chain) { if (S.chain.first === drop) S.chain.first = keep; if (S.chain.last === drop) S.chain.last = keep; } }
function deleteNode(id) { // kırığı sil
  const ls = P.lines.filter(l => l.a === id || l.b === id);
  if (ls.length === 2) { const o = ls.map(l => l.a === id ? l.b : l.a); const A = nw(o[0]), B = nw(o[1]), C = nw(id); const col = Math.abs(wrapPI((headDeg(A, C) - headDeg(C, B)) * deg)) < 1 * deg; const kind = col && ls.every(l => l.kind === 'typed') ? 'typed' : 'sketch'; P.lines = P.lines.filter(l => !ls.includes(l)); addLine(o[0], o[1], kind); }
  else P.lines = P.lines.filter(l => !ls.includes(l));
  P.nodes = P.nodes.filter(n => n.id !== id);
}
function deleteLine(l) { P.lines = P.lines.filter(x => x !== l); }

/* =================== Alan (oda) algılama: düzlemsel graf yüzleri =================== */
function computeFaces() {
  const vk = new Map(), verts = []; const key = p => Math.round(p[0] * 1e5) + '|' + Math.round(p[1] * 1e5);
  const vid = p => { const k = key(p); if (vk.has(k)) return vk.get(k); const i = verts.length; verts.push({ x: p[0], y: p[1], out: [] }); vk.set(k, i); return i; };
  const segs = P.lines.map(l => ({ a: nw(l.a), b: nw(l.b), l, ts: [{ t: 0, p: nw(l.a) }, { t: 1, p: nw(l.b) }] }));
  for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
    const s = segs[i], r = segs[j]; const x = segX(s.a, s.b, r.a, r.b); if (!x) continue; const e = 1e-7;
    if (x.t < -e || x.t > 1 + e || x.u < -e || x.u > 1 + e) continue;
    if (x.t > e && x.t < 1 - e) s.ts.push({ t: x.t, p: x.p }); if (x.u > e && x.u < 1 - e) r.ts.push({ t: x.u, p: x.p });
  }
  // nokta-çizgi temasları (T) için: düğüm bir çizginin üstündeyse
  segs.forEach(s => P.nodes.forEach(n => { if (n.id === s.l.a || n.id === s.l.b) return; const f = footT([n.x, n.y], s.a, s.b); if (f.t > 1e-7 && f.t < 1 - 1e-7 && V.dist(f.q, [n.x, n.y]) < 1e-6) s.ts.push({ t: f.t, p: [n.x, n.y] }); }));
  const ekeys = new Set(); const src = new Map();
  segs.forEach(s => { s.ts.sort((u, v) => u.t - v.t); for (let k = 0; k + 1 < s.ts.length; k++) { const u = vid(s.ts[k].p), v = vid(s.ts[k + 1].p); if (u === v) continue; const ek = Math.min(u, v) + '_' + Math.max(u, v); if (ekeys.has(ek)) continue; ekeys.add(ek); verts[u].out.push(v); verts[v].out.push(u); src.set(u + '>' + v, s.l.id); src.set(v + '>' + u, s.l.id); } });
  verts.forEach(v => v.out.sort((p, q) => Math.atan2(verts[p].y - v.y, verts[p].x - v.x) - Math.atan2(verts[q].y - v.y, verts[q].x - v.x)));
  // bileşenler
  const comp = new Array(verts.length).fill(-1); let nc = 0; verts.forEach((v, i) => { if (comp[i] >= 0) return; const st = [i]; comp[i] = nc; while (st.length) { const x = st.pop(); verts[x].out.forEach(y => { if (comp[y] < 0) { comp[y] = nc; st.push(y); } }); } nc++; });
  const seen = new Set(); const faces = [];
  verts.forEach((v, u0) => v.out.forEach(v0 => {
    if (seen.has(u0 + '>' + v0)) return; let u = u0, w = v0; const poly = [], lids = new Set(); let guard = 0;
    while (!seen.has(u + '>' + w) && guard++ < 100000) { seen.add(u + '>' + w); poly.push([verts[u].x, verts[u].y]); lids.add(src.get(u + '>' + w)); const L = verts[w].out; const i = L.indexOf(u); const nx = L[(i - 1 + L.length) % L.length]; u = w; w = nx; }
    const a = polyArea(poly); faces.push({ poly, area: a, lids, comp: comp[u0] });
  }));
  const bounded = faces.filter(f => f.area > 1e-6); const outer = faces.filter(f => f.area < -1e-6);
  // adalar (iç içe ayrı parçalar: kolon vb.)
  bounded.forEach(f => { f.holes = []; outer.forEach(o => { if (o.comp === f.comp) return; if (!inPoly(o.poly[0], f.poly)) return; const inner = bounded.some(g => g !== f && g.comp !== o.comp && Math.abs(g.area) < Math.abs(f.area) && inPoly(o.poly[0], g.poly) && inPoly(g.poly[0], f.poly)); if (!inner) f.holes.push(o.poly); }); f.net = f.area - f.holes.reduce((s, h) => s + Math.abs(polyArea(h)), 0); });
  return { faces: bounded };
}
function faceAt(p) { let best = null; G.faces.forEach(f => { if (!inPoly(p, f.poly) || f.holes.some(h => inPoly(p, h))) return; if (!best || f.area < best.area) best = f; }); return best; }
function setF(r, f) { Object.defineProperty(r, '_f', { value: f, writable: true, enumerable: false, configurable: true }); }
function updateRooms() {
  const used = new Set();
  P.rooms.forEach(r => { const f = faceAt([r.ax, r.ay]); setF(r, null); if (f && !used.has(f)) { used.add(f); setF(r, f); const ip = interiorPt(f.poly); if (!f.holes.some(h => inPoly(ip, h))) { r.ax = ip[0]; r.ay = ip[1]; } } });
}
function makeRoomAt(p, quiet) {
  const f = faceAt(p); if (!f) { if (!quiet) toast('Burada kapalı alan yok'); return null; }
  const ex = P.rooms.find(r => r._f === f); if (ex) { if (!quiet) { S.sel = { room: ex.id }; render(); } return ex; }
  const ip = interiorPt(f.poly); const r = { id: uid('r'), name: 'Oda ' + (++P.roomSeq), ax: ip[0], ay: ip[1] }; P.rooms.push(r); setF(r, f); return r;
}
function autoRooms(lineIds) { // yeni çizgilerle kapanan ve odası olmayan alanlara oda
  if (!SET.autoRoom) return []; const out = [];
  G.faces.forEach(f => { if (f.net < 0.3) return; const ip0 = interiorPt(f.poly); if (G.faces.some(g => g !== f && g.holes.some(h => inPoly(ip0, h)))) return; if (![...f.lids].some(id => lineIds.includes(id))) return; if (P.rooms.some(r => r._f === f)) return; const r = makeRoomAt(interiorPt(f.poly), true); if (r) out.push(r); });
  return out;
}

/* =================== Tuval =================== */
const cv = $('#cv'), ctx = cv.getContext('2d'), wrapEl = $('#wrap');
function resize() { const r = wrapEl.getBoundingClientRect(); DPR = window.devicePixelRatio || 1; if (r.width === W && r.height === H && cv.width === Math.round(r.width * DPR)) return; W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); draw(); }
new ResizeObserver(resize).observe(wrapEl);
const w2s = (x, y) => [view.ox + x * view.s, view.oy - y * view.s];
const s2w = (X, Y) => [(X - view.ox) / view.s, (view.oy - Y) / view.s];

    else if (sel.lines && sel.lines.length === 1 && !(sel.nodes || []).length) { const l = lineById(sel.lines[0]); const a = headDeg(nw(l.a), nw(l.b)); h += `<div class="row"><span class="inf">Çizgi · <b style="color:#fff">${fmtM(lineLen(l), 3)} m</b> · ${{ sketch: 'eskiz', typed: 'yazılan', laser: 'lazer', total: 'total' }[l.kind]} · ${(((a % 180) + 180) % 180).toFixed(1)}°</span></div><div class="row"><button data-a="len">Uzunluk</button><button data-a="mv">Taşı</button><button class="dng" data-a="del">Sil</button><button data-a="unsel">✕</button></div>`; }
    else if (sel.nodes && sel.nodes.length === 1 && !(sel.lines || []).length) { const d = degreeOf(sel.nodes[0]); h += `<div class="row"><span class="inf">Köşe · ${d} çizgi bağlı</span></div><div class="row"><button data-a="cont">╱ Buradan devam</button><button data-a="mv">Taşı</button><button class="dng" data-a="del">${d === 2 ? 'Kırığı sil' : 'Sil'}</button><button data-a="unsel">✕</button></div>`; }
    else { const n = (sel.lines || []).length; h += `<div class="row"><span class="inf">${n} çizgi${(sel.nodes || []).length ? ' + ' + sel.nodes.length + ' köşe' : ''} seçili</span></div><div class="row"><button data-a="mv">Taşı</button><button class="dng" data-a="del">Sil</button><button data-a="unsel">✕</button></div>`; }
  } else if (S.tool === 'sil') h += `<div class="row"><span class="inf">Çizgi, köşe ya da oda adına dokun</span></div>`;
  else if (S.tool === 'oda') h += `<div class="row"><span class="inf">${P.rooms.length ? P.rooms.map(r => esc(r.name) + ' ' + (r._f ? r._f.net.toFixed(2) + ' m²' : 'açık')).join(' · ') : 'Henüz oda yok'}</span></div>`;
  $('#sheet').innerHTML = h ? `<div class="hd"><span></span></div>` + h : '';
}
$('#bar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.cat) setCat(b.dataset.cat); else if (b.dataset.tool) setTool(b.dataset.tool); });
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) { if (e.target.closest('.hd')) { S.np = !S.np; render(); } return; }
  if (b.dataset.k) { const k = b.dataset.k; const tgt = S.tool === 'dikdortgen' ? (S.field || 'w') : null; let v = tgt ? S.rect[tgt] : S.kbuf;
    if (k === '⌫') v = v.slice(0, -1); else if (k === 'C') v = ''; else if (v.length < 6) v = (v + k).replace(/^0+/, '');
    if (tgt) S.rect[tgt] = v; else S.kbuf = v; render(); return; }
  const a = b.dataset.a;
  if (a === 'np') S.np = !S.np;
  else if (a === 'ar') { arrowAdd(+b.dataset.v); return; }
  else if (a === 'back') { chainBack(); return; }
  else if (a === 'close') { if (S.chain) chainAdd({ type: 'end', node: S.chain.first, X: 0, Y: 0 }, 'sketch'); return; }
  else if (a === 'end') { finishChain(); toast('Çizgi bitti'); return; }
  else if (a === 'fld') S.field = b.dataset.v;
  else if (a === 'rclr') { S.rect.w = ''; S.rect.h = ''; }
  else if (a === 'unsel') { S.sel = null; }
  else if (a === 'del') { delSel(); return; }
  else if (a === 'mv') { S.move = { base: null }; S.kbuf = ''; }
  else if (a === 'mvx') { S.move = null; S.kbuf = ''; }
  else if (a === 'len') { S.lenEdit = { id: S.sel.lines[0], fix: 'A' }; S.kbuf = ''; }
  else if (a === 'fix') S.lenEdit.fix = b.dataset.v;
  else if (a === 'lenx') { S.lenEdit = null; S.kbuf = ''; }
  else if (a === 'lenok') { applyLen(); return; }
  else if (a === 'cont') { const id = S.sel.nodes[0]; setTool('cizgi'); S.chain = { first: id, last: id, n: 0, lines: [], firstLine: null }; render(); toast('Bu köşeden devam'); return; }
  else if (a === 'rname') { const r = roomById(S.sel.room); const n = prompt('Oda adı', r.name); if (n) { snap(); r.name = n.trim(); commit(); return; } }
  render();
});
$('#fOrtO').onclick = () => { SET.ortho = SET.ortho === 'obj' ? 'off' : 'obj'; writeJSON(LS_S, SET); toast(SET.ortho === 'obj' ? '90° kilit: çizdiğin objeye göre' : 'Kilit kapalı'); render(); };
$('#fOrtX').onclick = () => { SET.ortho = SET.ortho === 'xy' ? 'off' : 'xy'; writeJSON(LS_S, SET); toast(SET.ortho === 'xy' ? '90° kilit: ekran X-Y' : 'Kilit kapalı'); render(); };
$('#fSnap').onclick = () => { SET.snap = !SET.snap; writeJSON(LS_S, SET); toast('Yakalama ' + (SET.snap ? 'açık' : 'kapalı')); render(); };
$('#fFit').onclick = fit; $('#bUndo').onclick = undo; $('#bRedo').onclick = redo;

/* =================== Menü =================== */
function openModal(h) { $('#mbox').innerHTML = h; $('#modal').classList.remove('hid'); }
function closeModal() { $('#modal').classList.add('hid'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#bMenu').onclick = () => openModal(`<h3>${esc(P.name)}</h3>
  <div class="row"><button data-m="new">Yeni proje</button><button data-m="open">Proje aç</button></div>
  <div class="row"><button data-m="ren">Adlandır</button><button data-m="json">JSON yedek</button><button data-m="imp">JSON yükle</button></div>
  <h3>Ayarlar</h3>
  <label>Uzunluk yazıları <input type="checkbox" id="sLen" ${SET.showLen ? 'checked' : ''}></label>
  <label>Kapanan alana otomatik oda <input type="checkbox" id="sRoom" ${SET.autoRoom ? 'checked' : ''}></label>
  <h3>Renkler</h3><div class="inf" style="line-height:1.7"><span style="color:${COL.sketch}">■ eskiz (~)</span> · <span style="color:${COL.typed}">■ yazılan</span> · <span style="color:${COL.laser}">■ lazer (2. aşama)</span> · <span style="color:${COL.total}">■ total</span></div>
  <div class="row"><button class="p" data-m="ok">Kapat</button></div>
  <div class="inf" style="margin-top:10px">Aşama 1 · eski sürüm: <a href="eski.html" style="color:#60a5fa">eski.html</a></div>`);
$('#mbox').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const m = b.dataset.m;
  if (m === 'ok') { SET.showLen = $('#sLen').checked; SET.autoRoom = $('#sRoom').checked; writeJSON(LS_S, SET); closeModal(); render(); }
  else if (m === 'new') { const n = prompt('Proje adı', 'Kroki ' + new Date().toLocaleDateString('tr-TR')); if (!n) return; save(); P = newProject(n.trim()); undoSt = []; redoSt = []; S.chain = null; S.sel = null; commit(); fit(); closeModal(); }
  else if (m === 'open') { const all = allProjects(); const names = Object.keys(all).filter(k => all[k].v === 8).sort((a, c) => (all[c].saved || 0) - (all[a].saved || 0)); openModal('<h3>Projeler</h3><div class="list">' + names.map(n => `<button data-open="${esc(n)}">${esc(n)}</button>`).join('') + '</div><div class="row"><button data-m="ok0">Kapat</button></div>'); }
  else if (b.dataset.open) { save(); P = allProjects()[b.dataset.open]; undoSt = []; redoSt = []; S.chain = null; S.sel = null; commit(); fit(); closeModal(); }
  else if (m === 'ok0') closeModal();
  else if (m === 'ren') { const n = prompt('Proje adı', P.name); if (!n || n === P.name) return; const all = allProjects(); delete all[P.name]; writeJSON(LS_P, all); P.name = n.trim(); commit(); closeModal(); }
  else if (m === 'json') { const blob = new Blob([JSON.stringify(P)], { type: 'application/json' }); const f = new File([blob], P.name.replace(/[\\/:*?"<>|]+/g, '_') + '.json', { type: 'application/json' }); try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } } catch (er) { if (er.name === 'AbortError') return; } const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
  else if (m === 'imp') $('#fileIn').click();
});
$('#fileIn').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (!d || !Array.isArray(d.nodes)) throw new Error('Bu dosya yeni sürümün yedeği değil'); save(); P = d; undoSt = []; redoSt = []; commit(); fit(); closeModal(); toast('Yüklendi'); } catch (er) { alert('Okunamadı: ' + er.message); } e.target.value = ''; });

/* =================== Başlat =================== */
loadInitial(); resize(); commit(); fit();
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) navigator.serviceWorker.register('sw.js').catch(() => {});
window.RK = { get P() { return P; }, set P(v) { P = v; }, S, get G() { return G; }, SET, commit, fit, w2s, s2w, ns, candidate, faceAt, setTool, undo, redo, get view() { return view; }, get aim() { return aim; } };
</script>
</body>
