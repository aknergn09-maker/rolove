<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rölöve Kroki</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f2a37">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f5f7;--ink:#1f2a37;--mut:#6b7280;--acc:#0b7cc1;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:calc(4px + env(safe-area-inset-top)) 6px 4px;background:var(--ink);color:#fff}
header .t{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:0;border-radius:8px;padding:6px 9px;background:#e8ebf0;color:var(--ink);cursor:pointer;min-height:34px}
button:active{filter:brightness(.9)}
button.p{background:var(--acc);color:#fff}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.4}
header button{background:#334155;color:#fff;min-height:30px;padding:4px 9px}
#ble.ok{background:var(--ok)}#ble.busy{background:#a16207}#ble.bad{background:var(--bad)}
#tabs{display:flex;background:var(--ink);padding:0 4px 4px;gap:4px}
#tabs button{flex:1;background:#334155;color:#cbd5e1;min-height:32px;font-weight:600}
#tabs button.on{background:#f4f5f7;color:var(--ink)}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;left:0;top:0;display:block;background:#fbfbfc}
#hint{position:absolute;left:6px;right:48px;top:6px;background:rgba(31,42,55,.88);color:#fff;border-radius:8px;padding:5px 8px;font-size:12.5px;pointer-events:none}
#hint:empty{display:none}
#hint .g{color:#86efac}#hint .w{color:#fdba74}#hint .b{color:#fca5a5}
#fab{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:5px}
#fab button{width:36px;height:36px;min-height:36px;padding:0;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:16px}
#fab #bCheck{font-size:12px;font-weight:700}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 12px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;text-align:center}
#toast.show{opacity:.95}
#flash{position:absolute;right:8px;bottom:8px;background:var(--ok);color:#fff;font-weight:700;font-size:18px;padding:4px 10px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none}
#flash.show{opacity:1}
#panel{background:var(--card);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:5px;align-items:center}
.row>button{flex:1;min-width:0;padding:6px 3px}
.row>button.sq{flex:0 0 40px}
.info{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{color:var(--ink)}
input[type=text],select{font:inherit;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;min-width:0;background:#fff;color:var(--ink);min-height:34px}
.num{flex:1;min-width:60px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kp button{font-size:17px;font-weight:600;min-height:38px}
.kp6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.kp6 button{font-size:16px;font-weight:600;min-height:34px;padding:2px}
.tools{display:flex;gap:3px}.tools button{flex:1;padding:4px 0;font-size:16px;min-height:34px}
.buf{font-size:20px;font-weight:700;color:var(--acc);padding:0 6px;min-width:70px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:10}
.sheet.hidden{display:none}
.sheet .box{background:var(--card);width:100%;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));touch-action:pan-y;user-select:text;-webkit-user-select:text}
.box h3{margin:6px 0 6px;font-size:15px}
.box .row{flex-wrap:wrap;margin:4px 0}.box .row>button{flex:1 1 45%;min-height:38px}
.box label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.list button{display:block;width:100%;text-align:left;margin:4px 0}
pre{font-size:11.5px;background:#f1f5f9;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}
.tag{display:inline-block;padding:1px 6px;border-radius:7px;font-size:11.5px;background:#e2e8f0;color:var(--ink)}
.tag.ok{background:#dcfce7;color:var(--ok)}.tag.warn{background:#ffedd5;color:var(--warn)}.tag.bad{background:#fee2e2;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 10px}
td,th{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="bMenu" data-tip="Menü: DXF, proje, ayarlar, lazer günlüğü">☰</button>
    <div class="t" id="title">Rölöve Kroki</div>
    <button id="ble" data-tip="Bosch lazer metreye Bluetooth ile bağlan">Lazer bağla</button>
  </header>
  <div id="tabs">
    <button data-tab="kroki" data-tip="Çizim: elle çiz, basılı tutup yakala, takip">Kroki</button>
    <button data-tab="olc" data-tip="Ölçü: kenar/çapraz seç, lazerle ya da elle ölç">Ölç</button>
    <button data-tab="no" data-tip="Köşelere nokta numarası ver">Nokta No</button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="fab">
      <button id="bUndo" data-tip="Geri al">↶</button>
      <button id="bRedo" data-tip="Yinele">↷</button>
      <button id="bFit" data-tip="Çizimi ekrana sığdır">⤢</button>
      <button id="bCheck" data-tip="Gönye ve kontrol raporu">✓?</button>
    </div>
    <div id="toast"></div>
    <div id="flash"></div>
  </div>
  <div id="panel"></div>
</div>
<div class="sheet hidden" id="sheet"><div class="box" id="sheetBox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
/* =================== Sabitler =================== */
const SVC = '02a6c0d0-0451-4000-b000-fb3210111989';
const CHR = '02a6c0d1-0451-4000-b000-fb3210111989';
const AUTOSYNC = [0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A];
const LS_PROJ = 'rk2_projects', LS_CUR = 'rk2_current', LS_SET = 'rk2_settings';
const deg = Math.PI / 180;
const SIG_EST = 0.5, SIG_ON = 0.001;

/* =================== Durum =================== */
const defSet = { scaleDen: 50, defaultTurn: -90, autoAdvance: true, offset: 0, demo: false, sigD: 0.002, sigA: 2, gonyeTol: 0.3, autoDiag: true, orthoTol: 35, circleDia: true, showLen: true, ignoreAfterSet: 3, ortho: true, doorW: 0.9, wallT: 0.2, lastR: 0.5 };
let SET = Object.assign({}, defSet, readJSON(LS_SET, {}));
let P = null;
let S = { tab: 'kroki', kmode: 'serbest', active: null, chain: null, sel: null, mfrom: null, pendingTurn: SET.defaultTurn, lastMeasure: null, noBuf: '1', ignoreUntil: 0, kbuf: '', circC: null, dpart: 'w' };
let A = null;
let undoStack = [], redoStack = [];
let view = { s: 40, ox: 0, oy: 0 };
const bleLog = [];

function readJSON(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function newProject(name) { return { v: 3, name: name || ('Proje ' + new Date().toLocaleDateString('tr-TR')), pts: [], edges: [], shapes: [], cons: [], naming: { prefix: '', num: 1 }, roomSeq: 0, created: Date.now() }; }
function allProjects() { return readJSON(LS_PROJ, {}); }
function saveProject() { const all = allProjects(); P.saved = Date.now(); all[P.name] = P; writeJSON(LS_PROJ, all); localStorage.setItem(LS_CUR, P.name); }
function loadInitial() { const all = allProjects(); const cur = localStorage.getItem(LS_CUR); P = (cur && all[cur]) ? all[cur] : newProject(); P.shapes.forEach(s => { if (!s.ring) s.ring = []; if (!s.turn) s.turn = []; }); ensureCad(); }

/* =================== Yardımcılar =================== */
const $ = q => document.querySelector(q);
const norm180 = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; };
const wrapPI = a => Math.atan2(Math.sin(a), Math.cos(a));
const fmt = v => v.toFixed(3);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function parseNum(s) { s = String(s).trim().replace(',', '.'); const v = parseFloat(s); return isFinite(v) ? v : NaN; }
function turnText(t) { if (t === null || t === undefined) return 'serbest'; t = norm180(t); if (Math.abs(t) < 1e-9) return 'Düz'; return (t > 0 ? 'Sol ' : 'Sağ ') + (+Math.abs(t).toFixed(2)) + '°'; }
const ptById = id => P.pts.find(p => p.id === id);
const edgeById = id => P.edges.find(e => e.id === id);
const shapeById = id => P.shapes.find(s => s.id === id);
const pname = id => { const p = ptById(id); return p ? p.name : '?'; };
const plen = (a, b) => { const p = ptById(a), q = ptById(b); return Math.hypot(q.x - p.x, q.y - p.y); };
const edgeName = e => pname(e.a) + '–' + pname(e.b);
function nextName() { const used = new Set(P.pts.map(p => p.name)); let n; do { n = (P.naming.prefix || '') + P.naming.num; P.naming.num++; } while (used.has(n)); return n; }
function addPt(x, y, name) { const id = uid('p'); P.pts.push({ id, name: name || nextName(), x, y }); return id; }
function addEdge(a, b, kind, len) { const e = { id: uid('e'), a, b, kind, len: len === undefined ? null : len, est: plen(a, b) }; e.est0 = e.est; P.edges.push(e); return e; }
function findEdge(a, b) { return P.edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a)); }
function shapeEdges(sh) { const out = []; const n = sh.ring.length; const m = sh.closed ? n : n - 1; for (let i = 0; i < m; i++) { const e = findEdge(sh.ring[i], sh.ring[(i + 1) % n]); if (e) out.push(e); } return out; }
function shapeOfPoint(id) { return P.shapes.find(s => s.ring.includes(id)); }
function polyArea(ids) { let s = 0; for (let i = 0; i < ids.length; i++) { const a = ptById(ids[i]), b = ptById(ids[(i + 1) % ids.length]); s += a.x * b.y - b.x * a.y; } return s / 2; }
function headOf(a, b) { const p = ptById(a), q = ptById(b); return Math.atan2(q.y - p.y, q.x - p.x) / deg; }
const snapTurn = (t, tol) => { const t90 = Math.round(t / 90) * 90; return Math.abs(t - t90) <= (tol || 10) ? norm180(t90) : null; };

/* =================== Geri al =================== */
function snap() { undoStack.push(JSON.stringify(P)); if (undoStack.length > 150) undoStack.shift(); redoStack = []; }
function undo() { if (!undoStack.length) return toast('Geri alınacak işlem yok'); redoStack.push(JSON.stringify(P)); P = JSON.parse(undoStack.pop()); fixSel(); commit(); }
function redo() { if (!redoStack.length) return toast('Yinelenecek işlem yok'); undoStack.push(JSON.stringify(P)); P = JSON.parse(redoStack.pop()); fixSel(); commit(); }
function fixSel() {
  if (S.sel && S.sel.type === 'edge' && !edgeById(S.sel.id)) S.sel = null;
  if (S.sel && S.sel.type === 'pt' && !ptById(S.sel.id)) S.sel = null;
  if (S.sel && S.sel.type === 'circle' && !shapeById(S.sel.id)) S.sel = null;
  if (S.active && !shapeById(S.active)) S.active = null;
  if (S.chain && !shapeById(S.chain)) S.chain = null;
  if (S.mfrom && !ptById(S.mfrom)) S.mfrom = null;
  if (S.sel && S.sel.type === 'door' && !(P.doors || []).some(d => d.id === S.sel.id)) S.sel = null;
  if (S.sel && S.sel.type === 'offset' && !(P.offsets || []).some(d => d.id === S.sel.id)) S.sel = null;
  if (S.sel && S.sel.type === 'fillet' && !(P.fillets || {})[S.sel.id]) S.sel = null;
  if (S.circC && !ptById(S.circC)) S.circC = null;
}
function commit() { ensureCad(); solve(); A = analyze(); saveProject(); render(); }

/* =================== Dengeleme (en küçük kareler) =================== */
const F = {
  dist: c => Math.hypot(c[2] - c[0], c[3] - c[1]) + 1e-12,
  turn: c => Math.atan2(c[5] - c[3], c[4] - c[2]) - Math.atan2(c[3] - c[1], c[2] - c[0]),
  online: c => { const dx = c[4] - c[2], dy = c[5] - c[3], l = Math.hypot(dx, dy) + 1e-12; return (dx * (c[1] - c[3]) - dy * (c[0] - c[2])) / l; },
  perp: c => { const ux = c[2] - c[0], uy = c[3] - c[1], vx = c[6] - c[4], vy = c[7] - c[5]; return (ux * vx + uy * vy) / ((Math.hypot(ux, uy) + 1e-12) * (Math.hypot(vx, vy) + 1e-12)); }
};
function buildObs(weak) {
  const O = []; const KS = weak ? shapeScales() : null;
  P.edges.forEach(e => {
    if (e.len != null) O.push({ ids: [e.a, e.b], f: F.dist, v: e.len, s: SET.sigD, k: 'd', e });
    else if (weak) O.push({ ids: [e.a, e.b], f: F.dist, v: estScaled(e, KS), s: SIG_EST, k: 'est', e });
  });
  if (weak) P.shapes.forEach(sh => {
    const n = sh.ring.length; if (n < 3) return;
    sh.turn.forEach((t, i) => {
      if (t === null || t === undefined) return;
      if (!sh.closed && (i === 0 || i === n - 1)) return;
      const a = sh.ring[(i - 1 + n) % n], b = sh.ring[i], c = sh.ring[(i + 1) % n];
      if (!findEdge(a, b) || !findEdge(b, c)) return;
      O.push({ ids: [a, b, c], f: F.turn, v: t * deg, s: SET.sigA * deg, k: 'turn', wrap: true, sh, i });
    });
  });
  P.cons.forEach(c => {
    if (c.type === 'online') O.push({ ids: [c.p, c.a, c.b], f: F.online, v: 0, s: SIG_ON, k: 'on' });
    else if (c.type === 'perp' && weak) O.push({ ids: [c.a, c.b, c.c, c.d], f: F.perp, v: 0, s: SET.sigA * deg, k: 'perp' });
  });
  return O.filter(o => o.ids.every(id => ptById(id)));
}
function shapeScales() { const k = new Map(); P.shapes.forEach(sh => { if (sh.ring.length < 2) return; const r = []; shapeEdges(sh).forEach(e => { const b = e.est0 || e.est; if (e.len != null && b > 0.05 && e.kind !== 'diag') r.push(e.len / b); }); if (r.length) { r.sort((a, b) => a - b); k.set(sh.id, r[Math.floor((r.length - 1) / 2)]); } }); return k; }
function estScaled(e, KS) { const b = e.est0 || e.est; if (!KS) return b; const sh = P.shapes.find(s => s.ring.includes(e.a) && s.ring.includes(e.b)); const k = sh && KS.get(sh.id); return k ? b * Math.max(0.2, Math.min(5, k)) : b; }
function obsGrad(o, X, idx) {
  const cols = []; o.ids.forEach(id => { const j = idx.get(id); cols.push(2 * j, 2 * j + 1); });
  const c = cols.map(k => X[k]); const f0 = o.f(c);
  let r = f0 - o.v; if (o.wrap) r = wrapPI(r);
  const g = cols.map((_, m) => { const h = 1e-6; const c1 = c.slice(); c1[m] += h; const c2 = c.slice(); c2[m] -= h; let d = o.f(c1) - o.f(c2); if (o.wrap) d = wrapPI(d); return d / (2 * h); });
  return { cols, g, r };
}
function cholSolve(N, b, n) {
  const L = new Float64Array(n * n);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let s = N[i * n + j]; for (let k = 0; k < j; k++) s -= L[i * n + k] * L[j * n + k];
      if (i === j) L[i * n + i] = Math.sqrt(Math.max(s, 1e-18)); else L[i * n + j] = s / L[j * n + j];
    }
  }
  const y = new Float64Array(n); for (let i = 0; i < n; i++) { let s = b[i]; for (let k = 0; k < i; k++) s -= L[i * n + k] * y[k]; y[i] = s / L[i * n + i]; }
  const x = new Float64Array(n); for (let i = n - 1; i >= 0; i--) { let s = y[i]; for (let k = i + 1; k < n; k++) s -= L[k * n + i] * x[k]; x[i] = s / L[i * n + i]; }
  return x;
}
function solve() {
  if (!P.pts.length) return;
  const idx = new Map(P.pts.map((p, i) => [p.id, i])); const n = P.pts.length * 2;
  const X = new Float64Array(n); P.pts.forEach((p, i) => { X[2 * i] = p.x; X[2 * i + 1] = p.y; }); const X0 = X.slice();
  const O = buildObs(true);
  for (let it = 0; it < 25; it++) {
    const N = new Float64Array(n * n), b = new Float64Array(n);
    for (let k = 0; k < n; k++) { const w = 1e-6; N[k * n + k] += w + 1e-9; b[k] += w * (X[k] - X0[k]); }
    O.forEach(o => {
      const { cols, g, r } = obsGrad(o, X, idx); const w = 1 / (o.s * o.s);
      for (let a = 0; a < cols.length; a++) { b[cols[a]] += w * g[a] * r; for (let c = 0; c < cols.length; c++) N[cols[a] * n + cols[c]] += w * g[a] * g[c]; }
    });
    const dx = cholSolve(N, b, n); let mx = 0;
    for (let k = 0; k < n; k++) { const d = Math.max(-5, Math.min(5, dx[k])); X[k] -= d; mx = Math.max(mx, Math.abs(d)); }
    if (mx < 1e-8) break;
  }
  P.pts.forEach((p, i) => { p.x = X[2 * i]; p.y = X[2 * i + 1]; });
}

/* ---------- Belirlilik ve gönye analizi ---------- */
function analyze() {
  const res = { unfixed: new Set(), defect: 0, redund: 0, conflicts: [], shapes: [], sug: [] };
  if (!P.pts.length) return res;
  const idxAll = new Map(P.pts.map((p, i) => [p.id, i]));
  const XA = new Float64Array(P.pts.length * 2); P.pts.forEach((p, i) => { XA[2 * i] = p.x; XA[2 * i + 1] = p.y; });
  const O = buildObs(false);
  O.forEach(o => { if (o.k === 'd') { const { r } = obsGrad(o, XA, idxAll); const lim = Math.max(3 * SET.sigD, 0.005); if (Math.abs(r) > lim) res.conflicts.push({ e: o.e, r }); } });
  // ölçüyle bağlı bileşenler
  const par = new Map(P.pts.map(p => [p.id, p.id])); const find = x => { while (par.get(x) !== x) { par.set(x, par.get(par.get(x))); x = par.get(x); } return x; };
  O.forEach(o => o.ids.slice(1).forEach(id => { const ra = find(o.ids[0]), rb = find(id); if (ra !== rb) par.set(ra, rb); }));
  const comps = new Map(); P.pts.forEach(p => { const r = find(p.id); if (!comps.has(r)) comps.set(r, []); comps.get(r).push(p); });
  comps.forEach(cp => {
    if (cp.length < 2) { cp.forEach(p => res.unfixed.add(p.id)); return; }
    const idx = new Map(cp.map((p, i) => [p.id, i])); const n = cp.length * 2;
    const X = new Float64Array(n); cp.forEach((p, i) => { X[2 * i] = p.x; X[2 * i + 1] = p.y; });
    const rows = [];
    O.forEach(o => { if (!idx.has(o.ids[0])) return; const { cols, g } = obsGrad(o, X, idx); const row = new Float64Array(n); cols.forEach((c, m) => row[c] += g[m]); rows.push(row); });
    let cx = 0, cy = 0; cp.forEach(p => { cx += p.x; cy += p.y; }); cx /= cp.length; cy /= cp.length;
    const gx = new Float64Array(n), gy = new Float64Array(n), gr = new Float64Array(n);
    cp.forEach((p, i) => { gx[2 * i] = 1; gy[2 * i + 1] = 1; gr[2 * i] = -(p.y - cy); gr[2 * i + 1] = p.x - cx; });
    const M = rows.concat([gx, gy, gr]).map(r => { let s = 0; for (const v of r) s += v * v; s = Math.sqrt(s) || 1; return r.map(v => v / s); });
    const piv = []; let rI = 0;
    for (let c = 0; c < n && rI < M.length; c++) {
      let best = rI; for (let r = rI + 1; r < M.length; r++) if (Math.abs(M[r][c]) > Math.abs(M[best][c])) best = r;
      if (Math.abs(M[best][c]) < 1e-8) continue;
      [M[rI], M[best]] = [M[best], M[rI]]; const pv = M[rI][c]; for (let k = 0; k < n; k++) M[rI][k] /= pv;
