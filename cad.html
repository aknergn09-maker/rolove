#cv.nope{animation:nope .35s}

.b{width:48px;height:48px;flex:0 0 48px;border:0;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#d8dde3;background:#262b33;touch-action:manipulation}
.b svg{width:27px;height:27px}.b.on{background:#2b6fd6;color:#fff}.b.sn{background:#262b33;color:#8a929c}.b.sn.on{background:#1e5a3a;color:#7dffb0}
.b.open{outline:2px solid #2b6fd6}.b.dis{opacity:.35}.b.okb{background:#2b6fd6;color:#fff}
#fly{position:fixed;z-index:30;right:68px;display:none;flex-direction:column;gap:6px;padding:6px 7px;background:rgba(30,34,40,.95);border-radius:14px;max-height:calc(100% - 16px);overflow-y:auto}
#qp,#np{position:fixed;z-index:10;right:68px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:none;gap:6px;padding:6px;background:rgba(30,34,40,.92);border-radius:14px}

.num{width:48px;height:48px;border:0;border-radius:11px;background:#3a3020;color:#ffcf70;font:bold 17px Arial;touch-action:manipulation}
.ver{margin-top:auto;text-align:center;font:10px Arial;color:#4a525c;padding-top:6px}

.num.k{background:#2a2f37;color:#e8e8e8}
